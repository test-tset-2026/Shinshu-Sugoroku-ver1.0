/* 信州 道の駅すごろく — スマホ用の画面
   画面が小さいときは「コンパクト表示」に切りかえる。
   地図だけを表示して指で拡大・移動でき、操作は画面の上下にある大きなパネルで行う。 */

const MAP_BOUNDS = { x0: 280, y0: 10, x1: 1192, y1: 962 };
const Cam = { s: 1, x: 0, y: 0, user: false };
let compact = false;

const isCompactSize = (vw, vh) => Math.min(vw / STAGE_W, vh / STAGE_H) < 0.62;

// メッセージやダイアログは、コンパクト表示では地図の外（画面そのもの）に出す
function setCompact(on) {
  compact = on;
  document.body.classList.toggle('compact', on);
  const target = document.getElementById(on ? 'overlay' : 'stage');
  ['msg', 'dice', 'banner', 'bearpop', 'hint', 'modal', 'start'].forEach(id => target.appendChild(document.getElementById(id)));
}

function hudInsets() {
  const t = document.querySelector('.hud-top'), b = document.querySelector('.hud-bottom');
  return { top: t ? t.getBoundingClientRect().height : 0, bottom: b ? b.getBoundingClientRect().height : 0 };
}
function syncHudVars() {
  const { top, bottom } = hudInsets();
  document.body.style.setProperty('--hud-t', `${Math.round(top)}px`);
  document.body.style.setProperty('--hud-b', `${Math.round(bottom)}px`);
}
function camArea() {
  const { top, bottom } = hudInsets();
  return { x: 0, y: top, w: window.innerWidth, h: Math.max(120, window.innerHeight - top - bottom) };
}
function camLimits() {
  const A = camArea();
  const fit = Math.min(A.w / (MAP_BOUNDS.x1 - MAP_BOUNDS.x0), A.h / (MAP_BOUNDS.y1 - MAP_BOUNDS.y0));
  return { min: fit, max: Math.max(fit * 1.5, 1.7) };
}
const camPlayZoom = () => { const A = camArea(); return Math.min(A.w, A.h) / 430; };

function camApply(animate) {
  const st = document.getElementById('stage');
  st.style.transition = animate ? 'transform .35s ease' : 'none';
  st.style.transform = `translate(${Cam.x}px, ${Cam.y}px) scale(${Cam.s})`;
}
function camClamp() {
  const A = camArea(), L = camLimits();
  Cam.s = Math.min(L.max, Math.max(L.min, Cam.s));
  const mw = (MAP_BOUNDS.x1 - MAP_BOUNDS.x0) * Cam.s, mh = (MAP_BOUNDS.y1 - MAP_BOUNDS.y0) * Cam.s;
  if (mw <= A.w) Cam.x = A.x + (A.w - mw) / 2 - MAP_BOUNDS.x0 * Cam.s;
  else Cam.x = Math.min(A.x - MAP_BOUNDS.x0 * Cam.s, Math.max(A.x + A.w - MAP_BOUNDS.x1 * Cam.s, Cam.x));
  if (mh <= A.h) Cam.y = A.y + (A.h - mh) / 2 - MAP_BOUNDS.y0 * Cam.s;
  else Cam.y = Math.min(A.y - MAP_BOUNDS.y0 * Cam.s, Math.max(A.y + A.h - MAP_BOUNDS.y1 * Cam.s, Cam.y));
}
function camFit(animate = true) { Cam.s = camLimits().min; camClamp(); camApply(animate); }
function camCenter(x, y, s = Cam.s, animate = true) {
  const A = camArea();
  Cam.s = s;
  const L = camLimits(); Cam.s = Math.min(L.max, Math.max(L.min, Cam.s));
  Cam.x = A.x + A.w / 2 - x * Cam.s;
  Cam.y = A.y + A.h / 2 - y * Cam.s;
  camClamp(); camApply(animate);
}
function camBox(x0, y0, x1, y1, minS = 0) {
  const A = camArea(), pad = 60;
  const s = Math.min(A.w / (x1 - x0 + pad * 2), A.h / (y1 - y0 + pad * 2), camPlayZoom() * 1.25);
  camCenter((x0 + x1) / 2, (y0 + y1) / 2, Math.max(s, minS));
}
const camZoomed = () => Cam.s > camLimits().min * 1.08;

/* ---- ゲームの進行にあわせてカメラを動かす ---- */
function camOnTurn(p) {
  if (!compact || !G || !p) return;
  Cam.user = false;
  const [x, y] = tokenXY(p);
  camCenter(x, y + 30, camPlayZoom());
}
function camOnPick(nodes) {
  if (!compact || !nodes.length) return;
  Cam.user = false;
  const xs = nodes.map(i => Board.nodes[i].x), ys = nodes.map(i => Board.nodes[i].y);
  // 候補が広がっていても、文字が読める大きさより小さくはしない（はみ出した候補は一覧からえらべる）
  camBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), camPlayZoom() * 0.72);
}
function camFollow(x, y) {
  if (!compact || Cam.user) return;
  const A = camArea();
  const sx = Cam.x + x * Cam.s, sy = Cam.y + y * Cam.s;
  const mx = A.w * 0.22, my = A.h * 0.22;
  if (sx < A.x + mx || sx > A.x + A.w - mx || sy < A.y + my || sy > A.y + A.h - my) camCenter(x, y, Cam.s, true);
}
function camShowStation(sid) {
  if (!compact) return;
  const n = Board.nodes[Board.stNode[sid]];
  camCenter(n.x, n.y, camPlayZoom());
}
function layoutCompact() {
  syncHudVars();
  if (Cam.user) { camClamp(); camApply(false); }
  else if (G && G.started && TOK[G.turn]) camOnTurn(P(G.turn));
  else camFit(false);
}

/* ---- 指での操作：1本指でスクロール、2本指で拡大縮小、ダブルタップで拡大 ---- */
function setupGestures() {
  const stage = document.getElementById('stage');
  const pts = new Map();
  let start = null, dragged = false, lastTap = 0;
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;
  const zoomAt = (px, py, s) => {
    const wx = (px - Cam.x) / Cam.s, wy = (py - Cam.y) / Cam.s;
    const L = camLimits();
    Cam.s = Math.min(L.max, Math.max(L.min, s));
    Cam.x = px - wx * Cam.s; Cam.y = py - wy * Cam.s;
    camClamp();
  };
  stage.addEventListener('pointerdown', e => {
    if (!compact) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { start = { cam: { ...Cam }, p: { x: e.clientX, y: e.clientY } }; dragged = false; }
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; start = { cam: { ...Cam }, mid: mid(a, b), dist: dist(a, b) }; }
  });
  stage.addEventListener('pointermove', e => {
    if (!compact || !pts.has(e.pointerId) || !start) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1 && start.p) {
      const dx = e.clientX - start.p.x, dy = e.clientY - start.p.y;
      if (!dragged && Math.hypot(dx, dy) < 9) return;
      dragged = true; Cam.user = true;
      Cam.x = start.cam.x + dx; Cam.y = start.cam.y + dy;
      camClamp(); camApply(false);
    } else if (pts.size >= 2 && start.mid) {
      const [a, b] = [...pts.values()];
      const m = mid(a, b);
      Object.assign(Cam, start.cam);
      zoomAt(start.mid.x, start.mid.y, start.cam.s * dist(a, b) / start.dist);
      Cam.x += m.x - start.mid.x; Cam.y += m.y - start.mid.y;
      camClamp(); camApply(false);
      dragged = true; Cam.user = true;
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 1) { const [a] = [...pts.values()]; start = { cam: { ...Cam }, p: a }; }
    else if (!pts.size) {
      start = null;
      if (!dragged && e.type === 'pointerup') {
        const now = Date.now();
        if (now - lastTap < 300 && !e.target.closest('.hl-ring, .st')) {
          Cam.user = true;
          zoomAt(e.clientX, e.clientY, camZoomed() ? camLimits().min : camPlayZoom() * 1.2);
          camApply(true);
          lastTap = 0;
        } else lastTap = now;
      }
    }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function tokenXY(p, overrideNode) {
  const node = overrideNode ?? p.pos;
  const n = Board.nodes[node];
  const here = G.players.filter(o => o.pos === node);
  const k = overrideNode != null ? 0 : here.indexOf(p), cnt = overrideNode != null ? 1 : here.length;
  if (Sprites.ready) {   // 立体の車：車輪が地面に着く点を置く
    const dx = (k - (cnt - 1) / 2) * 30;
    const dy = n.kind === 'station' ? -22 : n.kind === 'hub' ? -8 : 4;
    return [n.x + dx, n.y + dy];
  }
  const dx = (k - (cnt - 1) / 2) * 22;
  const dy = n.kind === 'station' ? -30 : n.kind === 'hub' ? -26 : -16;
  return [n.x + dx, n.y + dy];
}

    if (who === 'bear') { face.innerHTML = bearImg(84); tag.textContent = 'ボンビーぐま'; tag.style.background = '#4a3a2a'; }
    else if (who && who.idx !== undefined) { face.innerHTML = charSVG(def(who).char, 80); tag.textContent = def(who).name + (seatNick(who.idx) ? `（${seatNick(who.idx)}）` : ''); tag.style.background = def(who).color; }
    else { face.innerHTML = mascotImg(84, 'height:84px;object-fit:cover;object-position:50% 6%'); tag.textContent = 'アルクマ'; tag.style.background = '#d42a2a'; }
    box.querySelector('.txt').innerHTML = html;
    box.hidden = false;
    box.style.animation = 'none'; void box.offsetHeight; box.style.animation = '';
    let done = false;
    const finish = () => { if (done) return; done = true; box.hidden = true; msgResolve = null; if (Net.skip === finish) Net.skip = null; resolve(); };
    msgResolve = finish;
    if (isGuest()) Net.skip = finish;
    const auto = online() ? true : (opts.auto ?? !humanContext());
    box.querySelector('.next').hidden = auto;
    if (auto) setTimeout(finish, opts.ms ?? spd(1500));
  });
}

  5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]], 6: [[28, 22], [72, 22], [28, 50], [72, 50], [28, 78], [72, 78]] };
function drawDie(el, v) { el.innerHTML = PIPS[v].map(([x, y]) => `<i class="${v === 1 ? 'one' : ''}" style="left:${x}%;top:${y}%"></i>`).join(''); }
async function showDice(vals, hurry = false) {
  Sound.play('dice');
  const box = $('#dice');
  box.innerHTML = `<div class="row">${'<div class="die rolling"></div>'.repeat(vals.length)}</div>`;
  box.hidden = false;
  const dice = [...box.querySelectorAll('.die')];
  const t0 = performance.now();
  while (performance.now() - t0 < (hurry ? 150 : spd(850))) { dice.forEach(d => drawDie(d, 1 + Math.floor(Math.random() * 6))); await sleep(70); }
  dice.forEach((d, i) => { d.classList.remove('rolling'); d.classList.add('land'); drawDie(d, vals[i]); });
  box.insertAdjacentHTML('beforeend', `<div class="sum">${vals.reduce((a, b) => a + b, 0)}</div>`);
  Sound.play('click');
  await sleep(hurry ? 250 : spd(900));
  box.hidden = true;
}
async function rollDice(n) {
  await gate();
  const vals = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6));
  netEv({ t: 'dice', v: vals });
  await showDice(vals);
  return vals;
}

async function giveCard(p, k) {

  p.cards.push(k); refresh();

  await say(p, `<b>${CARDS[k].name}</b>を手に入れた！<br><span class="small">${CARDS[k].desc}</span>`);

async function useCard(p, key, opt) {
  const i = p.cards.indexOf(key);
  if (i < 0) return 'none';
  p.cards.splice(i, 1); refresh();
  const c = CARDS[key];
  sfx('card');
  await banner(c.name, c.desc, 1000);
  switch (key) {
    case 'kei': case 'bus': case 'shinano': case 'shinkansen':
      await doRoll(p, c.dice); return 'moved';
    case 'pittari': {
      let n = opt;
      if (n == null) {
        const ctrl = controller(p);
        if (ctrl === 'local') n = await chooseNumber();
        else if (ctrl === 'remote') { const a = await askRemote(p, { k: 'num' }); n = a && isInt(a.v, 1, 6) ? a.v : 1 + Math.floor(Math.random() * 6); }
        else n = 1 + Math.floor(Math.random() * 6);
      }
      await say(p, `ぴったり <b>${n}マス</b> 進むよ！`);
      await doRoll(p, 0, n); return 'moved';
    }
    case 'buttobi': {
      const s = pick(STATIONS.filter(x => Board.stNode[x.id] !== p.pos));
      const to = Board.stNode[s.id];
      netEv({ t: 'wp', p: p.idx, to });
      await showWarp(p, to);
      await say(p, `ぶっとんで「<b>${s.n}</b>」に着いた！`);
      await land(p, p.pos); return 'moved';
    }
    case 'block':
      G.players.forEach(o => { if (o !== p) o.slow = 1; });
      await say(p, 'ほかの社長は次の番、<b>1マス</b>しか進めない！'); return 'util';
    case 'summit':
      G.players.forEach(o => { o.pos = p.pos; }); placeTokens(); refresh();
      await say(p, `全員を「${nodeName(p.pos)}」に呼び集めた！`); return 'util';
    case 'tokusei': {
      const debtors = G.players.filter(o => o.money < 0);
      debtors.forEach(o => { o.money = 0; }); refresh();
      await say(p, debtors.length ? `${debtors.map(o => def(o).name).join('・')}の借金がチャラになった！` : 'だれも借金をしていなかった…'); return 'util';
    }
    case 'oyaki': {
      const amt = r100((1000 + Math.random() * 2000) * yf());
      p.money += amt; refresh(); sfx('coin'); fxAtPlayer(p, `+${fmt(amt)}`, '#1f63d6');
      await say(p, `おやきが飛ぶように売れて <b>${fmt(amt)}</b> の臨時収入！`); return 'util';
    }
    case 'bell': {
      if (G.bear !== p.idx) { await say(p, 'ボンビーぐまはついていなかった。'); return 'util'; }
      const dist = bfsFrom(p.pos);
      const target = G.players.filter(o => o !== p).sort((a, b) => dist[a.pos] - dist[b.pos])[0];
      G.bear = target.idx; refresh(); sfx('bear');
      await say(p, `チリンチリン！ボンビーぐまは<b>${def(target).name}</b>のほうへ逃げていった！`); return 'util';
    }
  }
  return 'util';
}
async function showWarp(p, to) {
  Sound.play('warp');
  const el = TOK[p.idx];
  el.style.opacity = '0'; await sleep(spd(400));
  p.pos = to; placeTokens();
  el.style.opacity = '1';
  const [wx, wy] = tokenXY(p); camFollow(wx, wy);
}

function nodeName(i) {
  const n = Board.nodes[i];
  if (n.kind === 'station') return '道の駅 ' + stOf(n.sid).n;
  if (n.kind === 'hub') return Board.hubById[n.hid].n + 'ターミナル';
  return { blue: '青マス', red: '赤マス', yellow: '黄マス' }[n.type];
}

/* ================= ターン進行 ================= */
const MenuWait = { resolve: null };
function setMenu(state) {
  const human = state === 'human';
  $('#m-roll').disabled = !human; $('#m-card').disabled = !G; $('#m-buy').disabled = !G;
  $('#m-roll').classList.toggle('ready', human);
  $('#h-roll').hidden = !human; $('#h-card').hidden = !human;
}
function waitMenu() {
  setMenu('human');
  return new Promise(resolve => {
    MenuWait.resolve = v => { MenuWait.resolve = null; setMenu('busy'); resolve(v); };
  });
}

async function runGame() {
  closeModal();
  $('#start').hidden = true;
  buildTokens(); refresh(); setMenu('busy');
  if (compact) layoutCompact();
  if (!G.started) {
    G.started = true;
    sfx('month');
    await banner(`${G.year}年目 ${G.month}月`, 'すごろくスタート！ 長野ターミナルから出発します');
    await chooseDestination(Board.hubNode.nagano);
    saveGame();
  }
  while (!G.over) {
    await playTurn(P(G.turn));
    if (G.over) break;
    G.turn++;
    if (G.turn >= G.players.length) { G.turn = 0; await nextMonth(); }
    refresh();
    saveGame();
    if (isHost()) hostPush();
  }
}

async function playTurn(p) {
  netEv({ t: 'turn', p: p.idx });
  refresh();
  camOnTurn(p);
  mascotSay(`${def(p).name}の<br>番だよ！`);
  const ctrl = controller(p);
  if (ctrl === 'cpu') {
    await sleep(spd(450));
    await cpuTurn(p);
  } else {
    const nick = seatNick(p.idx);
    await banner(`${def(p).name}の番`, nick ? `${esc(nick)}さんの番です` : '', 900);
    mascotSay(G.bear === p.idx ? 'ボンビーぐまに<br>気をつけて！' : 'サイコロを<br>ふってね！');
    for (;;) {
      let act;
      if (ctrl === 'local') act = await waitMenu();
      else {
        const a = await askRemote(p, { k: 'menu' });
        if (!a) { await cpuTurn(p); break; }
        act = a.a === 'card' && typeof a.k === 'string' ? { type: 'card', key: a.k } : { type: 'roll' };
      }
      if (act.type === 'roll') { await doRoll(p, 1); break; }
      if (!p.cards.includes(act.key) || (act.key === 'bell' && G.bear !== p.idx)) continue;
      const r = await useCard(p, act.key);
      refresh();
      if (r === 'moved') break;
    }
  }
  if (G.bear === p.idx) await bearAct(p);
  await settleDebt(p);
  refresh();
}

async function doRoll(p, n, fixed) {
  let steps;
  if (fixed) steps = fixed;
  else steps = (await rollDice(n)).reduce((a, b) => a + b, 0);
  if (p.slow > 0) { p.slow = 0; steps = 1; await say(p, '通行止めのせいで <b>1マス</b> しか進めない！'); }
  await moveSteps(p, steps);
}

async function moveSteps(p, steps) {
  const dn = destNode();
  const options = reachable(p.pos, steps);
  const ctrl = controller(p);
  let path;
  if (ctrl === 'local') path = await pickPath(p, options, steps);
  else if (ctrl === 'remote') {
    const a = await askRemote(p, { k: 'path', st: steps });
    path = (a && isInt(a.nd, 0, Board.nodes.length - 1) && options.get(a.nd)) || cpuPickPath(p, options);
  } else path = cpuPickPath(p, options);
  await animateMove(p, path);
  await land(p, path[path.length - 1]);
}

/* 止まるマスを選ぶ（この画面の人） */
const Picking = { active: false, cancel: () => {} };
function pickPath(p, options, steps) {
  return new Promise(resolve => {
    Picking.active = true;
    const dn = destNode();
    const hl = UI.gHl; hl.innerHTML = '';
    const preview = svgEl('polyline', { class: 'hl-path', points: '' }, hl);
    const showPath = path => preview.setAttribute('points', path.map(i => `${Board.nodes[i].x},${Board.nodes[i].y}`).join(' '));
    const twoStep = compact;   // スマホでは「えらぶ → ここに止まる」の2段階にして押しまちがいを防ぐ
    const dist = bfsFrom(dn);
    const order = [...options.keys()].sort((a, b) => dist[a] - dist[b]);
    const label = node => `${node === dn ? '目的地 ' : ''}${nodeName(node)}・あと${dist[node]}`;
    if (twoStep) {
      $('#hint').innerHTML = `<div class="pick-box"><div class="pick-title">出目 <b>${steps}</b>！ 止まるマスをえらんでね</div>
        <div class="pick-list">${order.map(node => `<button type="button" class="pick-chip${node === dn ? ' goal' : ''}" data-node="${node}">${esc(label(node))}</button>`).join('')}</div>
        <div class="pick-sel" hidden><span class="pick-name"></span><button class="btn small green" id="pick-ok" type="button">ここに止まる</button></div></div>`;
    } else $('#hint').innerHTML = `<span>出目 <b>${steps}</b>！ 光っているマスをクリックして止まる場所をえらんでね</span>`;
    $('#hint').hidden = false;
    uiMascot(options.has(dn) ? '目的地に<br>ぴったり止まれる！' : 'どこに<br>止まる？');
    const clear = () => { Picking.active = false; hl.innerHTML = ''; $('#hint').hidden = true; };
    Picking.cancel = clear;
    const finish = path => {
      clear();
      uiMascot(path[path.length - 1] === dn ? 'いけー！<br>目的地へ！' : 'しゅっぱーつ！');
      resolve(path);
    };
    const rings = new Map();
    const choose = node => {
      const path = options.get(node);
      if (!twoStep) return finish(path);
      showPath(path);
      hl.querySelectorAll('.hl-ring.sel').forEach(r => r.classList.remove('sel'));
      rings.get(node).classList.add('sel');
      $('#hint').querySelectorAll('.pick-chip').forEach(c => c.classList.toggle('on', +c.dataset.node === node));
      const sel = $('#hint .pick-sel');
      sel.hidden = false;
      sel.querySelector('.pick-name').textContent = `「${nodeName(node)}」`;
      $('#pick-ok').onclick = () => { Sound.play('click'); finish(path); };
      const n = Board.nodes[node];
      camCenter(n.x, n.y, Cam.s);
    };
    if (twoStep) $('#hint').querySelectorAll('.pick-chip').forEach(c => c.addEventListener('click', () => { Sound.init(); Sound.play('click'); choose(+c.dataset.node); }));
    for (const [node, path] of options) {
      const n = Board.nodes[node];
      const goal = node === dn;
      const big = twoStep ? 6 : 0;
      const el = n.kind === 'station'
        ? svgEl('rect', { x: n.x - n.w / 2 - 6 - big / 2, y: n.y - 19 - big / 2, width: n.w + 12 + big, height: 38 + big, rx: 10, class: 'hl-ring' + (goal ? ' goal' : '') }, hl)
        : svgEl('circle', { cx: n.x, cy: n.y, r: (n.kind === 'hub' ? 23 : 17) + big, class: 'hl-ring' + (goal ? ' goal' : '') }, hl);
      const tt = svgEl('title', {}, el); tt.textContent = nodeName(node);
      rings.set(node, el);
      el.addEventListener('mouseenter', () => { if (!twoStep) showPath(path); });
      el.addEventListener('click', () => { Sound.init(); Sound.play('click'); choose(node); });
    }
    if (options.size === 1) showPath([...options.values()][0]);
    camOnPick([p.pos, ...options.keys()]);
  });
}

function cpuPickPath(p, options) {
  const dn = destNode();
  if (options.has(dn)) return options.get(dn);
  const dist = bfsFrom(dn);
  let best = null, bs = Infinity;
  for (const [node, path] of options) {
    const n = Board.nodes[node];
    let s = dist[node] * 10;
    if (n.kind === 'sq') s += { blue: -4, red: 10, yellow: -6 }[n.type];
    if (n.kind === 'station') s -= p.stamps.includes(n.sid) ? 2 : 7;
    if (n.kind === 'hub') s -= 3;
    const rest = path.slice(1);
    const holder = G.bear !== null && G.bear !== p.idx ? P(G.bear) : null;
    if (holder && rest.includes(holder.pos)) s += 80;
    if (G.bear === p.idx && rest.some(x => G.players.some(o => o !== p && o.pos === x))) s -= 70;
    s += Math.random() * 5;
    if (s < bs) { bs = s; best = path; }
  }
  return best;
}

async function cpuTurn(p) {
  const dn = destNode();
  const dist = bfsFrom(dn);
  const d = dist[p.pos];
  const has = k => p.cards.includes(k);
  const others = G.players.filter(o => o !== p);
  if (G.bear === p.idx && has('bell')) await useCard(p, 'bell');
  if (p.money < 0 && has('tokusei')) await useCard(p, 'tokusei');
  if (has('oyaki') && (p.money < 3000 * yf() || Math.random() < 0.3)) await useCard(p, 'oyaki');
  if (has('block') && others.some(o => dist[o.pos] < d && dist[o.pos] <= 12)) await useCard(p, 'block');
  if (has('summit') && others.some(o => dist[o.pos] + 10 < d) && Math.random() < 0.6) await useCard(p, 'summit');
  const dd = bfsFrom(dn)[p.pos];
  if (has('pittari') && dd <= 6) {
    for (let k = 1; k <= 6; k++) if (reachable(p.pos, k).has(dn)) { await useCard(p, 'pittari', k); return; }
  }
  if (dd >= 9) {
    const diceCards = ['shinkansen', 'shinano', 'bus', 'kei'].filter(has);
    const fit = diceCards.find(k => CARDS[k].dice * 3.5 <= dd + 5) || (dd > 20 ? diceCards[0] : null);
    if (fit) { await useCard(p, fit); return; }
  }
  if (has('buttobi') && dd >= 26 && Math.random() < 0.5) { await useCard(p, 'buttobi'); return; }
  await doRoll(p, 1);
}

// コマを1マスずつ動かす（演出だけ）
async function moveToken(p, path, hurry = false) {
  const el = TOK[p.idx];
  UI.gTok.appendChild(el);
  el.classList.remove('active');
  for (let j = 1; j < path.length; j++) {
    const a = Board.nodes[path[j - 1]], b = Board.nodes[path[j]];
    if (a !== b) setCarDir(p.idx, carDirIndex(b.x - a.x, b.y - a.y));
    const [x, y] = tokenXY(p, path[j]);
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.classList.remove('hop'); void el.getBoundingClientRect(); el.classList.add('hop');
    camFollow(x, y);
    Sound.play('step');
    await sleep(hurry ? 40 : spd(190));
  }
  p.pos = path[path.length - 1];
  placeTokens();
}
async function animateMove(p, path) {
  netEv({ t: 'mv', p: p.idx, path });
  // すれちがいでボンビーぐまがうつるかを先に決める
  let note = null;
  if (G.bear !== null) {
    for (let j = 1; j < path.length && !note; j++) {
      const here = G.players.filter(o => o !== p && o.pos === path[j]);
      if (!here.length) continue;
      if (G.bear === p.idx) note = [p, here[0]];
      else if (here.some(o => o.idx === G.bear)) note = [P(G.bear), p];
    }
  }
  await moveToken(p, path);
  if (G.dest && path.slice(1, -1).includes(destNode()) && path[path.length - 1] !== destNode()) {
    mascotSay('おしい！目的地は<br>ぴったり止まってね');
  }
  if (note) {
    G.bear = note[1].idx; refresh();
    sfx('bear');
    await say('bear', `すれちがいざまに<b>${def(note[1]).name}</b>にのりうつったのねん！`);
  }
}

/* ================= 止まったマス ================= */
async function land(p, node) {
  refresh();
  const n = Board.nodes[node];
  if (n.kind === 'station') {
    if (n.sid === G.dest) await arrive(p);
    await visitStation(p, n.sid);
  } else if (n.kind === 'hub') await cardShop(p, n.hid);
  else if (n.type === 'blue') await blueSquare(p);
  else if (n.type === 'red') await redSquare(p);
  else await giveCard(p, drawCardKey());
  refresh();
}

async function blueSquare(p) {
  const amt = r10(pick([300, 500, 800, 1000, 1200, 1500, 2000]) * yf());
  p.money += amt; refresh(); sfx('coin'); fxAtPlayer(p, `+${fmt(amt)}`, '#1f63d6');
  await say(p, `${pick(BLUE_MSGS)}<br><b>${fmt(amt)}</b> もうかった！`);
}
async function redSquare(p) {
  const winter = [12, 1, 2].includes(G.month);
  const amt = r10(pick([300, 500, 800, 1000, 1500, 2000, 2500]) * yf() * (winter ? 1.5 : 1));
  p.money -= amt; refresh(); sfx('bad'); fxAtPlayer(p, `-${fmt(amt)}`, '#e0302f');
  await say(p, `${winter ? pick(WINTER_RED_MSGS) : pick(RED_MSGS)}<br><span class="minus">${fmt(amt)}</span> 失った…`);
}

async function visitStation(p, sid) {
  const s = stOf(sid);
  if (!p.stamps.includes(sid)) {
    p.stamps.push(sid);
    const bonus = r10(300 * yf());
    p.money += bonus; refresh();
    sfx('stamp'); fxAtPlayer(p, 'スタンプ!', '#e0302f');
    await say(p, `道の駅「<b>${s.n}</b>」のスタンプをゲット！（${p.stamps.length}/${STATIONS.length}駅）<br>記念に <b>${fmt(bonus)}</b> もらった！`);
    if (p.stamps.length === STATIONS.length) { sfx('fanfare'); await banner('信州制覇！', `${def(p).name}が全${STATIONS.length}駅のスタンプを集めた！`, 2000); }
  }
  if (p.human) await buyFlow(p, sid);
  else {
    const bought = cpuBuy(p, sid);
    if (bought.length) {
      refresh(); sfx('buy');
      await say(p, `「${bought.join('」「')}」を買いました！${isMono(sid, p.idx) ? '<br><b>独占達成！</b> 収益が2倍になります' : ''}`);
    }
  }
}

function purchase(p, sid, i) {
  const pr = stOf(sid).props[i];
  p.money -= pr[1]; G.owners[propKey(sid, i)] = p.idx;
  sfx('buy'); refresh();
  return isMono(sid, p.idx);
}
async function monoBanner(p, s) { sfx('fanfare'); await banner('独占達成！', `${def(p).name}が「${s.n}」の物件をぜんぶ手に入れた！収益2倍`, 1500); }

function renderBuyDialog(p, sid, onBuy, onDone) {
  const s = stOf(sid);
  const dlg = openModal(`<div class="dlg-h"><span style="background:#1a5fc8;border-radius:6px;padding:0 8px">${s.id}</span>道の駅 ${s.n}<span class="sub">持ち金 ${fmt(p.money)}</span></div>
    <div class="dlg-b">${stationLead(sid)}${propRows(sid, { buyer: p })}
    <p class="desc">ぜんぶ買うと<b>独占</b>で収益が2倍！ 収益は毎年3月の決算で入ります。</p></div>
    <div class="dlg-f"><button class="btn gray" data-close>買い物をおわる</button></div>`);
  const lock = () => dlg.querySelectorAll('button').forEach(x => { x.disabled = true; });
  dlg.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { lock(); onBuy(+b.dataset.buy); });
  dlg.querySelector('[data-close]').onclick = () => { lock(); onDone(); };
}
async function buyFlow(p, sid) {
  const s = stOf(sid);
  if (s.props.every((_, i) => ownerOf(sid, i) !== undefined) && !s.props.some((_, i) => ownerOf(sid, i) === p.idx)) {
    return say(p, `「${s.n}」の物件はすべて売り切れていた…`);
  }
  if (controller(p) === 'local') {
    await new Promise(resolve => {
      const render = () => renderBuyDialog(p, sid, async i => {
        if (p.money >= s.props[i][1] && ownerOf(sid, i) === undefined) {
          const mono = purchase(p, sid, i);
          netEv({ t: 'say', w: p.idx, h: `「${s.props[i][0]}」を買いました！`, ms: spd(1000) });
          if (mono) { closeModal(); await monoBanner(p, s); }
        }
        render();
      }, () => { closeModal(); resolve(); });
      render();
    });
    return;
  }
  for (;;) {
    const a = await askRemote(p, { k: 'buy', sid });
    if (!a) {
      const bought = cpuBuy(p, sid);
      if (bought.length) { refresh(); sfx('buy'); await say(p, `「${bought.join('」「')}」を買いました！`); }
      return;
    }
    if (a.a !== 'buy') return;
    const i = a.i;
    if (!isInt(i, 0, s.props.length - 1) || ownerOf(sid, i) !== undefined || p.money < s.props[i][1]) continue;
    const mono = purchase(p, sid, i);
    await say(p, `「${s.props[i][0]}」を買いました！`, { ms: spd(1100) });
    if (mono) await monoBanner(p, s);
  }
}

function cpuBuy(p, sid) {
  const s = stOf(sid);
  const reserve = 2500 * yf() + (G.bear === p.idx ? 2500 : 0);
  const list = s.props.map((pr, i) => ({ pr, i })).filter(o => ownerOf(sid, o.i) === undefined).sort((a, b) => b.pr[2] - a.pr[2]);
  const bought = [];
  for (const o of list) {
    if (p.money - o.pr[1] >= reserve) { p.money -= o.pr[1]; G.owners[propKey(sid, o.i)] = p.idx; bought.push(o.pr[0]); }
  }
  return bought;
}

const cardPrice = k => r100(CARDS[k].price * yf());
function shopBuy(p, k) { p.money -= cardPrice(k); p.cards.push(k); sfx('card'); refresh(); }
function renderShopDialog(p, hid, onBuy, onDone) {
  const h = Board.hubById[hid];
  const dlg = openModal(`<div class="dlg-h">${h.n}ターミナル カード売り場<span class="sub">持ち金 ${fmt(p.money)}・${p.cards.length}/8枚</span></div>
    <div class="dlg-b"><div class="cards">${SHOP_CARDS.map(k => cardTile(k, `data-k="${k}" ${p.money < cardPrice(k) || p.cards.length >= 8 ? 'disabled' : ''}`) + `<span class="cp">${fmt(cardPrice(k))}</span></button>`).join('')}</div></div>
    <div class="dlg-f"><button class="btn gray" data-close>お店を出る</button></div>`);
  const lock = () => dlg.querySelectorAll('button').forEach(x => { x.disabled = true; });
  dlg.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { lock(); onBuy(b.dataset.k); });
  dlg.querySelector('[data-close]').onclick = () => { lock(); onDone(); };
}
async function cardShop(p, hid) {
  const h = Board.hubById[hid];
  const canBuy = k => SHOP_CARDS.includes(k) && p.money >= cardPrice(k) && p.cards.length < 8;
  const ctrl = controller(p);
  if (ctrl === 'cpu') {
    const affordable = SHOP_CARDS.filter(k => p.money - cardPrice(k) > 5000 * yf() && p.cards.length < 6);
    const want = ['shinano', 'bus', 'pittari', 'kei', 'bell'].find(k => affordable.includes(k) && (k !== 'bell' || G.bear === p.idx));
    if (want) { shopBuy(p, want); await say(p, `${h.n}ターミナルで「${CARDS[want].name}」を買いました！`); }
    else await say(p, `${h.n}ターミナルでひと休み。`, { ms: spd(900) });
    return;
  }
  if (ctrl === 'local') {
    await new Promise(resolve => {
      const render = () => renderShopDialog(p, hid, k => {
        if (canBuy(k)) { shopBuy(p, k); netEv({ t: 'say', w: p.idx, h: `「${CARDS[k].name}」を買いました！`, ms: spd(1000) }); }
        render();
      }, () => { closeModal(); resolve(); });
      render();
    });
    return;
  }
  for (;;) {
    const a = await askRemote(p, { k: 'shop', h: hid });
    if (!a || a.a !== 'buy') return;
    if (!canBuy(a.k)) continue;
    shopBuy(p, a.k);
    await say(p, `${h.n}ターミナルで「${CARDS[a.k].name}」を買いました！`, { ms: spd(1100) });
  }
}

/* ================= 目的地・到着 ================= */
async function showRoulette(destId, hurry = false) {
  const s = stOf(destId);
  const b = $('#banner');
  b.classList.remove('out'); b.hidden = false;
  const t0 = performance.now();
  let i = 0;
  while (performance.now() - t0 < (hurry ? 200 : spd(1600))) {
    const r = STATIONS[(i++ * 7) % STATIONS.length];
    b.innerHTML = `<div class="bn" style="animation:none"><div class="bn-sub">つぎの目的地は…</div><div class="bn-main">${r.n}</div></div>`;
    Sound.play('click');
    await sleep(70);
  }
  G.dest = destId; refresh();
  b.innerHTML = `<div class="bn"><div class="bn-sub">つぎの目的地は…</div><div class="bn-main">${s.n}</div></div>`;
  Sound.play('month');
  flashStation(destId);
  camShowStation(destId);
  await sleep(hurry ? 300 : spd(1300));
  b.classList.add('out'); await sleep(240); b.hidden = true;
}
async function chooseDestination(fromNode) {
  const dist = bfsFrom(fromNode);
  const cands = STATIONS.filter(s => s.id !== G.dest && dist[Board.stNode[s.id]] >= 14);
  const s = pick(cands.length ? cands : STATIONS);
  G.destDist = dist[Board.stNode[s.id]];
  await gate();
  netEv({ t: 'rl', d: s.id });
  await showRoulette(s.id);
  mascotSay(`目的地は<br>${s.n}！`);
  await say(null, `つぎの目的地は「<b>道の駅 ${s.n}</b>」（${s.town}）です！`, { auto: !G.players.some(q => q.human) });
}

async function arrive(p) {
  const s = stOf(G.dest);
  sfx('fanfare');
  await banner('目的地 到着！', `${def(p).name}が「${s.n}」に一番乗り！`, 1700);
  const bonus = r100((3000 + G.destDist * 160) * yf());
  p.money += bonus; p.arrivals = (p.arrivals || 0) + 1; refresh();
  fxAtPlayer(p, `+${fmt(bonus)}`, '#1f63d6');
  await say(p, `到着援助金として <b>${fmt(bonus)}</b> もらいました！`);
  const dist = bfsFrom(destNode());
  const others = G.players.filter(o => o !== p).sort((a, b) => dist[b.pos] - dist[a.pos] || Math.random() - 0.5);
  const far = others[0];
  if (G.bear !== far.idx) {
    G.bear = far.idx; refresh(); sfx('bear');
    netEv({ t: 'bp' });
    await showBearPop();
    await say('bear', `いちばん遠くにいる<b>${def(far).name}</b>にとりついたのねん！`);
  }

async function bearAct(p) {
  const props = ownedProps(p);
  const acts = [
    { w: 34, f: () => { const a = r10((300 + Math.random() * 1700) * yf()); p.money -= a; sfx('bad'); return `おなかがすいたから、おやきを買い食いしたのねん！<br><span class="minus">${fmt(a)}</span> 使っちゃった`; } },
    { w: 18, f: () => { const a = r100((1000 + Math.random() * 4000) * yf()); p.money -= a; sfx('bad'); return `高級はちみつを爆買いしたのねん！<br><span class="minus">${fmt(a)}</span> 使っちゃった`; } },
    { w: p.cards.length ? 16 : 0, f: () => { const n = Math.min(p.cards.length, 1 + Math.floor(Math.random() * 2)); const lost = []; for (let i = 0; i < n; i++) lost.push(CARDS[p.cards.splice(Math.floor(Math.random() * p.cards.length), 1)[0]].name); sfx('bad'); return `カードで遊んでいたら、なくしちゃったのねん！<br>「${lost.join('」「')}」が消えた…`; } },
    { w: props.length ? 14 : 0, f: () => { const o = pick(props); delete G.owners[propKey(o.sid, o.i)]; p.money += r10(o.price / 2); sfx('bad'); return `「${stOf(o.sid).n}」の「${o.name}」を勝手に半額で売っちゃったのねん！`; } },
    { w: 14, f: () => { const a = r10((500 + Math.random() * 1000) * yf()); p.money += a; sfx('coin'); return `山できのこを見つけてきたのねん。<br><b>${fmt(a)}</b> で売れたよ！`; } },
  ];
  const total = acts.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * total, act = acts[0];
  for (const a of acts) { r -= a.w; if (r < 0) { act = a; break; } }
  const text = act.f();
  refresh();
  await say('bear', text);
}

function sellProp(p, o) { delete G.owners[propKey(o.sid, o.i)]; p.money += r10(o.price / 2); sfx('coin'); refresh(); }
function renderDebtDialog(p, onSell) {
  const props = ownedProps(p);
  const dlg = openModal(`<div class="dlg-h">借金を返そう<span class="sub">持ち金 ${fmt(p.money)}</span></div>
    <div class="dlg-b"><p class="desc">お金がマイナスです。物件を<b>半額</b>で売って借金を返してください。</p>
    <table class="ptable">${props.map(o => `<tr><td class="pn">${o.name}</td><td>${stOf(o.sid).n}</td><td class="num">${fmt(o.price)}</td><td><button class="btn small red" data-key="${o.sid}:${o.i}">売る（+${fmt(r10(o.price / 2))}）</button></td></tr>`).join('')}</table></div>`);
  dlg.querySelectorAll('[data-key]').forEach(b => b.onclick = () => { dlg.querySelectorAll('button').forEach(x => { x.disabled = true; }); onSell(b.dataset.key); });
}
async function settleDebt(p) {
  if (p.money >= 0 || !ownedProps(p).length) return;
  const autoSell = async () => {
    let props = ownedProps(p).sort((a, b) => a.price - b.price);
    const sold = [];
    while (p.money < 0 && props.length) {
      const need = -p.money;
      const o = props.find(x => x.price / 2 >= need) || props[props.length - 1];
      props = props.filter(x => x !== o);
      sellProp(p, o); sold.push(o.name);
    }
    await say(p, `借金を返すために「${sold.join('」「')}」を売りました…`);
  };
  const ctrl = controller(p);
  if (ctrl === 'cpu') return autoSell();
  if (ctrl === 'local') {
    await new Promise(resolve => {
      const render = () => {
        if (p.money >= 0 || !ownedProps(p).length) { closeModal(); resolve(); return; }
        renderDebtDialog(p, key => {
          const o = ownedProps(p).find(x => propKey(x.sid, x.i) === key);
          if (o) sellProp(p, o);
          render();
        });
      };
      render();
    });
    return;
  }
  while (p.money < 0 && ownedProps(p).length) {
    const a = await askRemote(p, { k: 'debt' });
    if (!a) return autoSell();
    const o = a.a === 'sell' && ownedProps(p).find(x => propKey(x.sid, x.i) === a.key);
    if (o) { sellProp(p, o); await say(p, `「${o.name}」を半額で売りました`, { ms: spd(1000) }); }
  }
}

// ホストから届いた演出イベントをこの画面で再生する（ゲスト）
async function playEv(ev, hurry) {
  const pl = i => (isInt(i, 0, 3) && G ? P(i) : null);
  const dur = v => (isInt(v, 0, 20000) ? v : 1200);
  switch (ev.t) {
    case 'turn': if (pl(ev.p)) { G.turn = ev.p; refresh(); camOnTurn(P(ev.p)); } break;
    case 'say': await uiSay(ev.w === 'b' ? 'bear' : pl(ev.w), safeHtml(ev.h), { auto: true, ms: hurry ? 350 : Math.round(dur(ev.ms) * 0.95) }); break;
    case 'bn': await uiBanner(esc(ev.m), esc(ev.s), hurry ? 300 : Math.round(dur(ev.ms) * 0.9)); break;
    case 'ms': uiMascot(safeHtml(ev.h)); break;
    case 'fx': { const p = pl(ev.p); if (p) uiFx(p, String(ev.x ?? '').slice(0, 30), /^#[0-9a-f]{6}$/i.test(ev.c) ? ev.c : '#1f63d6'); break; }
    case 'sfx': if (SFX_OK.has(ev.n)) Sound.play(ev.n); break;
    case 'dice': if (Array.isArray(ev.v) && ev.v.length >= 1 && ev.v.length <= 5 && ev.v.every(v => isInt(v, 1, 6))) await showDice(ev.v, hurry); break;
    case 'mv': {
      const p = pl(ev.p);
      if (p && Array.isArray(ev.path) && ev.path.length >= 1 && ev.path.length <= 64 && ev.path.every(x => isInt(x, 0, Board.nodes.length - 1))) await moveToken(p, ev.path, hurry);
      break;
    }
    case 'rl': if (isInt(ev.d, 1, STATIONS.length) && stOf(ev.d)) await showRoulette(ev.d, hurry); break;
    case 'wp': { const p = pl(ev.p); if (p && isInt(ev.to, 0, Board.nodes.length - 1)) await showWarp(p, ev.to); break; }
    case 'ks': {
      const ok = a => Array.isArray(a) && a.length === 4 && a.every(Number.isFinite);
      if (ok(ev.inc) && ok(ev.mo)) await showSettlement(ev.inc, ev.mo, true);
      break;
    }
    case 'bp': await showBearPop(); break;
    case 'go': break;   // 最終結果は状態の同期（G.over）で表示する
  }
}

function guestPrompt(pr) {
  const valid = pr && typeof pr === 'object' && isInt(pr.n, 1, 1e9) && isInt(pr.s, 0, 3);
  const mine = valid && Net.mySeat >= 0 && pr.s === Net.mySeat;
  if (valid && !mine) {
    $('#hint').innerHTML = `<span><b>${esc(seatNick(pr.s) || 'だれか')}</b>さん（${PLAYER_DEFS[pr.s].name}）が考え中…</span>`;
    $('#hint').hidden = false;
  } else if (!Picking.active) $('#hint').hidden = true;
  if (!mine) { Net.activePrompt = null; cancelPromptUI(); return; }
  if (pr.n <= Net.answeredN) return;
  if (Net.activePrompt && Net.activePrompt.n === pr.n) return;
  cancelPromptUI();
  Net.activePrompt = pr;
  runGuestPrompt(pr);
}
async function runGuestPrompt(pr) {
  const p = P(Net.mySeat);
  Sound.play('click');
  switch (pr.k) {
    case 'menu': {
      uiMascot(G.bear === p.idx ? 'ボンビーぐまに<br>気をつけて！' : 'あなたの番！<br>サイコロをふってね');
      const act = await waitMenu();
      guestAnswer(pr, act.type === 'card' ? { a: 'card', k: act.key } : { a: 'roll' });
      break;
    }
    case 'path': {
      if (!isInt(pr.st, 1, 60)) return;
      const path = await pickPath(p, reachable(p.pos, pr.st), pr.st);
      guestAnswer(pr, { nd: path[path.length - 1] });
      break;
    }
    case 'num': guestAnswer(pr, { v: await chooseNumber() }); break;
    case 'buy': if (isInt(pr.sid, 1, STATIONS.length) && stOf(pr.sid)) renderBuyDialog(p, pr.sid, i => guestAnswer(pr, { a: 'buy', i }), () => { guestAnswer(pr, { a: 'done' }); closeModal(); }); break;
    case 'shop': if (typeof pr.h === 'string' && Object.prototype.hasOwnProperty.call(Board.hubById, pr.h)) renderShopDialog(p, pr.h, k => guestAnswer(pr, { a: 'buy', k }), () => { guestAnswer(pr, { a: 'done' }); closeModal(); }); break;
    case 'debt': renderDebtDialog(p, key => guestAnswer(pr, { a: 'sell', key })); break;
  }
}

        <div class="ob"><div class="ob-h">部屋をつくる</div><p>あなたがホストになって、部屋番号と合言葉をみんなに伝えます。</p><button class="btn red" id="b-host">部屋をつくる</button></div>
        <div class="ob"><div class="ob-h">部屋に入る</div><p>教えてもらった4けたの部屋番号と合言葉を入れてね。</p>
          <div class="join-row"><input id="in-code" class="text-in code" inputmode="numeric" maxlength="4" placeholder="1234" value="${back ? esc(back.code) : ''}" autocomplete="off"><button class="btn green" id="b-join">入る</button></div></div>
      </div>
      ${back ? `<button class="btn" id="b-back">部屋 ${esc(back.code)} にもどる</button>` : ''}
      <p class="note" id="online-note">オンライン対戦が使えるか確認しています…</p>
    </div></div>`;
  const sync = () => {
    st.querySelectorAll('[data-h]').forEach(b => b.classList.toggle('on', humans[+b.dataset.h] === (b.dataset.v === '1')));
    st.querySelectorAll('[data-y]').forEach(b => b.classList.toggle('on', +b.dataset.y === years));
  };
  st.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { humans[+b.dataset.h] = b.dataset.v === '1'; sync(); });
  st.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { years = +b.dataset.y; sync(); });
  sync();
  const showTab = name => {
    st.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
    st.querySelectorAll('.tab-body').forEach(b => { b.hidden = b.dataset.body !== name; });
  };
  st.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
  if (back) showTab('online');
  $('#b-new').onclick = () => { Sound.init(); clearSave(); newGame({ years, humans }); runGame(); };
  if (save) $('#b-cont').onclick = () => { Sound.init(); G = save; delete G.nodeCount; runGame(); };
  $('#b-rules').onclick = () => { st.hidden = true; rulesDialog(() => { st.hidden = false; }); };

  const nickVal = () => { const v = cleanNick($('#in-nick').value); Settings.nick = v; saveSettings(); return v; };
  const onlineBtns = [$('#b-host'), $('#b-join'), $('#b-back')].filter(Boolean);
  onlineBtns.forEach(b => { b.disabled = true; });
  const note = $('#online-note');
  const NOTES = {
    mqtt: 'インターネットにつながっていれば、4人まで対戦できます。部屋番号と合言葉を伝えるだけでOK。通信は合言葉で暗号化され、合言葉を知らない人には中身が読めません。',
    claude: 'このページを開いている人どうしで、4人まで対戦できます。相手にもこのページを共有してね（相手もClaudeにログインしている必要があります）。',
    mock: '開発用のテストモードです（同じブラウザのタブどうしでつながります）。',
  };
  netApi().then(t => {
    if (t) { onlineBtns.forEach(b => { b.disabled = false; }); note.textContent = NOTES[t.kind]; $('#pass-row').hidden = t.kind !== 'mqtt'; }
    else note.textContent = 'このページではオンライン対戦を使えません。';
  });
  const busy = (on, msg) => { onlineBtns.forEach(b => { b.disabled = on; }); if (msg) note.textContent = msg; };
  const netFail = e => busy(false, e && e.message === 'no-crypto'
    ? 'このページでは暗号化が使えません。https:// ではじまるアドレスで開いてね。'
    : 'サーバーにつながりませんでした。インターネット接続を確かめて、もう一度ためしてね。');
  // 合言葉（公開サーバー経由のときだけ必要）
  const passVal = () => {
    if (!Net.api || Net.api.kind !== 'mqtt') return '';
    const v = $('#in-pass').value.trim();
    if ([...v].length < 6) { note.textContent = '合言葉は6文字以上にしてね（8文字以上で、家族だけが知っている言葉がおすすめ）。'; $('#in-pass').focus(); return null; }
    return v;
  };
  $('#b-host').onclick = async () => {
    Sound.init();
    const pass = passVal(); if (pass === null) return;
    busy(true, '部屋をつくっています…');
    try { await netCreate(nickVal(), pass); renderLobby(); } catch (e) { console.warn(e); netFail(e); }
  };
  const join = async (code, passOverride) => {
    Sound.init();
    if (!/^\d{4}$/.test(code)) { note.textContent = '部屋番号は4けたの数字で入れてね。'; return; }
    if (passOverride && !$('#in-pass').value.trim()) $('#in-pass').value = passOverride;
    const pass = passVal(); if (pass === null) return;
    busy(true, `部屋 ${code} に入っています…`);
    try { await netJoin(code, nickVal(), pass); renderLobby(); } catch (e) { console.warn(e); netFail(e); }
  };
  $('#b-join').onclick = () => join($('#in-code').value.trim());
  $('#in-code').addEventListener('keydown', e => { if (e.key === 'Enter') join($('#in-code').value.trim()); });
  if (back) $('#b-back').onclick = () => join(String(back.code), back.pass);
  Music.update();
}

function newGame({ years, humans }) {
  G = {
    v: 1, years, year: 1, month: 4, turn: 0, started: false, over: false,
    players: PLAYER_DEFS.map((d, i) => ({ idx: i, human: humans[i], remote: false, money: 10000, pos: Board.hubNode.nagano, cards: ['kei'], stamps: [], slow: 0, arrivals: 0 })),
    owners: {}, dest: null, destDist: 0, bear: null,
  };
}

/* ================= 起動 ================= */
async function boot() {
  loadSettings();
  fitStage();
  netApi();   // オンライン対戦が使えるかを先に調べておく
  try {
    await Promise.race([
      Promise.all([document.fonts.load(LABEL_FONT, '道の駅'), document.fonts.load('400 40px "Mochiy Pop One"', '信州道の駅すごろく'), document.fonts.load('900 20px "M PLUS Rounded 1c"', '長野県')]),
      sleep(3000),
    ]);
  } catch (e) { /* フォントが読めなくても続行 */ }
  buildBoard();
  paintIfNeeded();
  UI = renderBoard($('#map'));
  buildChrome();
  initSprites(onSpritesReady);   // 立体の車とクマを裏で準備（使えないときは平面のまま）
  setMenu('busy'); $('#m-card').disabled = true; $('#m-buy').disabled = true;
  let rt;
  window.addEventListener('resize', () => { fitStage(); clearTimeout(rt); rt = setTimeout(paintIfNeeded, 400); });
  showStart();
}
boot();

</script>
</body>
</html>
