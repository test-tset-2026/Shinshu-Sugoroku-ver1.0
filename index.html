<style>
/* 信州 道の駅すごろく
   Layout: 1536x1024 の固定ステージを画面に合わせて拡大縮小する、すごろくゲーム盤 */
:root {
  --ink: #1b2440;
  --navy: #1b2a50;
  --navy-hi: #24479e;
  --navy-lo: #152e72;
  --gold: #f2b632;
  --gold-dk: #a8730a;
  --cream: #fffdf4;
  --red: #e0302f;
  --green: #22a04a;
  --badge: #1a5fc8;
  --sky: #bfe3f6;
  --f-pop: 'Mochiy Pop One', 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
  --f-ui: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(circle at 50% 30%, #d8f0fb, #8ec9ea); color: var(--ink); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
[hidden] { display: none !important; }

#viewport { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1536px; height: 1024px; transform-origin: 0 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
#bg { position: absolute; left: 0; top: 0; width: 1536px; height: 1024px; }
#map { position: absolute; left: 0; top: 0; width: 1536px; height: 1024px; }

/* ---------- マップ ---------- */
.nb-label { font: 900 23px var(--f-ui); fill: var(--navy); stroke: #fff; stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; letter-spacing: 1px; }
.rail-base path { fill: none; stroke: #1a1d24; stroke-width: 10; stroke-linecap: round; }
.rail-white path { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
.rail-dash path { fill: none; stroke: #1a1d24; stroke-width: 6; stroke-dasharray: 6 6; }
.sq-out { fill: #1a1d24; }
.sq-in { stroke: #fff; stroke-width: 2; }
.sq-icon { stroke: #fff; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.sq-card { fill: #fff; stroke: #c08000; stroke-width: 1.2; }
.hub-out { fill: #5a3a00; }
.hub-in { stroke: #fff; stroke-width: 2; }
.hub-tag { fill: var(--navy); stroke: #fff; stroke-width: 2; }
.hub-name { font: 900 12.5px var(--f-ui); fill: #fff; }
.st { cursor: pointer; }
.st-bg { fill: #fff; stroke: var(--navy); stroke-width: 2; filter: url(#f-shadow); }
.st-badge { fill: var(--badge); }
.st-num { font: 900 12.5px var(--f-ui); fill: #fff; }
.st-name { font: 800 13px var(--f-ui); fill: #161a24; }
.st:hover .st-bg { fill: #fff8d6; }
.st.dest .st-bg { stroke: var(--red); stroke-width: 3; fill: #fff3f1; }
.st.flash .st-bg { animation: st-flash .5s 4 alternate; }
@keyframes st-flash { to { fill: #ffe14d; } }
.sq, .hub { cursor: default; }
.decor { pointer-events: none; }

.owner-dot { stroke: #fff; stroke-width: 1.5; }
.mono-ring { fill: none; stroke-width: 3.5; }
.mono-crown { font: 900 11px var(--f-ui); fill: #fff; }

.dest-flag .bob { animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.dest-flag text { font: 900 13px var(--f-ui); fill: #fff; }

.hl-ring { fill: rgba(255, 228, 77, .25); stroke: #ffd400; stroke-width: 3.5; cursor: pointer; animation: hl 0.9s ease-in-out infinite alternate; }
.hl-ring.goal { stroke: #ff3b2f; fill: rgba(255, 90, 70, .25); }
.hl-ring:hover { fill: rgba(255, 228, 77, .55); }
@keyframes hl { from { stroke-opacity: 1; } to { stroke-opacity: .35; } }
.hl-path { fill: none; stroke: #ff8a00; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 12; animation: march .6s linear infinite; pointer-events: none; }
@keyframes march { to { stroke-dashoffset: -14; } }

.token { transition: transform .16s linear, opacity .3s; pointer-events: none; }
.token .tk { transition: transform .16s ease-out; }
.token.hop .tk { animation: hop .16s ease-out; }
@keyframes hop { 50% { transform: translateY(-9px); } }
.token.active .tk-ring { stroke: #ffe14d; stroke-width: 4; }
.token.active .tk { animation: idle-bounce 1s ease-in-out infinite; }
@keyframes idle-bounce { 50% { transform: translateY(-4px); } }

.fx-pop { font: 400 30px var(--f-pop); paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; animation: fx-rise 1.4s ease-out forwards; }
@keyframes fx-rise { from { transform: translateY(0); opacity: 1; } 70% { opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }

/* ---------- タイトル ---------- */
#title { position: absolute; left: 4px; top: 2px; width: 480px; height: 280px; pointer-events: none; }
.t-shin text, .t-michi text { font-family: var(--f-pop); }
.t-shin text { font-size: 92px; }
.t-michi text { font-size: 76px; }
.t-no { font-size: 58px; }
.t-o1 { fill: #0b2a12; stroke: #0b2a12; stroke-width: 18px; stroke-linejoin: round; }
.t-michi .t-o1 { fill: #4a0606; stroke: #3a0505; }
.t-o2 { fill: #fff; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; }
.t-f { stroke: rgba(0, 0, 0, .25); stroke-width: 1px; }
.t-sub { font: 900 21px var(--f-ui) !important; fill: #fff; letter-spacing: .5px; }
.t-54 { font: 400 30px var(--f-pop); fill: #ffe14d; }

/* ---------- 左メニュー ---------- */
#menu { position: absolute; left: 18px; top: 292px; width: 242px; padding: 8px; background: #fff; border-radius: 16px; border: 3px solid #cfd9e6; box-shadow: 0 4px 0 #98abc6, 0 10px 20px rgba(20, 40, 80, .25); display: flex; flex-direction: column; }
.mi { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px; border: 0; border-bottom: 2px solid #e5ebf2; background: transparent; font: 900 22px/1 var(--f-ui); color: var(--navy); cursor: pointer; text-align: left; border-radius: 10px; white-space: nowrap; letter-spacing: -0.3px; }
.mi:last-child { border-bottom: 0; }
.mi .ic { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; }
.mi .ic svg { width: 40px; height: 40px; }
.mi:disabled { opacity: .42; cursor: default; }
.mi:not(:disabled):hover { background: #eaf3ff; }
/* 自分の番のときだけ、サイコロの行をやさしく光らせる */
.mi-roll.ready { animation: ready 1.2s ease-in-out infinite; }
@keyframes ready { 50% { background: #fff1b8; } }
.mi:focus-visible, .btn:focus-visible, .chip:focus-visible { outline: 4px solid #ffb400; outline-offset: 2px; }

/* ---------- 状況 ---------- */
#status { position: absolute; left: 18px; top: 586px; width: 262px; height: 114px; background: rgba(255, 255, 255, .95); border-radius: 14px; border: 3px solid #cfd9e6; box-shadow: 0 3px 0 #98abc6; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.st-cal { font: 900 19px var(--f-ui); color: var(--navy); display: flex; align-items: baseline; gap: 2px; }
.st-cal span:not(.st-left) { font: 400 23px var(--f-pop); color: var(--red); margin: 0 2px; }
.st-left { margin-left: auto; font: 800 13px var(--f-ui); color: #fff; background: var(--navy); padding: 2px 8px; border-radius: 10px; }
.st-dest { display: flex; align-items: center; gap: 6px; font: 900 18px var(--f-ui); color: var(--ink); white-space: nowrap; min-width: 0; }
.st-dest #s-dest { overflow: hidden; text-overflow: ellipsis; }
.st-tag { background: var(--red); color: #fff; font-size: 13px; padding: 2px 7px; border-radius: 6px; flex: 0 0 auto; }
.st-turn { font: 800 14px var(--f-ui); color: #4a5470; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 全体図 ---------- */
#minimap { position: absolute; left: 14px; top: 708px; width: 266px; height: 212px; background: linear-gradient(#1f4597, #142f72); border-radius: 12px; border: 3px solid #fff; box-shadow: 0 0 0 2px #0b1a45, 0 6px 14px rgba(0, 0, 0, .3); padding: 6px 8px; color: #fff; }
#minimap h3 { margin: 0 0 4px; font: 900 16px var(--f-ui); }
.mm-body { display: flex; gap: 6px; }
.mm-map { position: relative; width: 136px; height: 172px; flex: 0 0 136px; }
#mm-canvas, #mm-over { position: absolute; left: 0; top: 0; width: 136px; height: 172px; }
#mm-legend { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
#mm-legend li { display: flex; align-items: center; gap: 6px; font: 800 13.5px var(--f-ui); white-space: nowrap; }
#mm-legend i { width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid #fff; flex: 0 0 15px; }

/* ---------- ロゴ ---------- */
#logo { position: absolute; left: 1022px; top: 10px; width: 162px; text-align: center; pointer-events: none; white-space: nowrap; }
.lg-ja { font: 900 48px/1 var(--f-ui); color: #1b9a3a; letter-spacing: 0; -webkit-text-stroke: 0; text-shadow: 3px 0 0 #fff, -3px 0 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 5px 0 #0e4a1c; }
.lg-en { font: 900 15px var(--f-ui); color: #134d22; letter-spacing: 7px; margin-top: 4px; text-shadow: 0 0 4px #fff, 0 0 2px #fff; }

/* ---------- 右の駅一覧 ---------- */
#list { position: absolute; left: 1188px; top: 8px; width: 342px; height: 1008px; background: var(--cream); border: 4px solid var(--gold); border-radius: 16px; box-shadow: 0 0 0 2px var(--gold-dk), 0 8px 18px rgba(0, 0, 0, .25); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
#list .lh { background: linear-gradient(var(--navy-hi), var(--navy-lo)); color: #fff; border-radius: 10px; font: 900 23px var(--f-ui); padding: 7px 12px; display: flex; align-items: baseline; justify-content: space-between; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .2); }
#list .lh b { color: #ffd83a; font: 400 28px var(--f-pop); }
.area-row { display: flex; gap: 7px; align-items: stretch; }
.area { flex: 1 1 0; border: 2.5px solid var(--ac); border-radius: 10px; background: #fff; padding: 0 5px 5px; min-width: 0; }
.area h4 { margin: 0 -5px 4px; background: var(--ac); color: #fff; font: 900 15px var(--f-ui); padding: 4px 7px; border-radius: 6px 6px 0 0; white-space: nowrap; }
.area h4 small { font-size: 13px; }
.area ul { list-style: none; margin: 0; padding: 0; }
.area li { display: flex; align-items: center; gap: 5px; height: 22px; font: 800 13.5px var(--f-ui); color: #1c2130; cursor: pointer; white-space: nowrap; border-radius: 4px; padding-right: 2px; }
.area li:hover { background: var(--soft); }
.area li .no { flex: 0 0 19px; height: 17px; border-radius: 4px; background: var(--badge); color: #fff; font: 900 11px/17px var(--f-ui); text-align: center; }
.area li .nm { display: inline-block; transform-origin: left center; }
.area li .wrap { flex: 1 1 auto; overflow: hidden; min-width: 0; }
.area li.is-dest { background: #ffe7e4; }
.area li.is-dest .no { background: var(--red); }
.area li .stamp { flex: 0 0 auto; display: flex; gap: 1px; }
.area li .stamp i { width: 5px; height: 5px; border-radius: 50%; }
#vignette { width: 150px; height: 196px; border-radius: 10px; border: 2.5px solid #9cc3e6; flex: 0 0 150px; }

/* ---------- プレイヤー ---------- */
#players { position: absolute; left: 10px; top: 934px; display: flex; gap: 8px; }
.pl { position: relative; width: 228px; height: 80px; border-radius: 12px; background: linear-gradient(var(--pc-l), var(--pc) 55%); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--pc-d), 0 5px 10px rgba(0, 0, 0, .3); transition: box-shadow .25s, transform .25s; }
.pl .face { position: absolute; left: 2px; top: -14px; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(#fff, #e9f2ff); border: 3px solid var(--pc-d); overflow: hidden; display: grid; place-items: center; }
.pl .nm { position: absolute; left: 68px; top: 5px; font: 900 18px var(--f-ui); color: #fff; text-shadow: 0 2px 0 var(--pc-d), 1px 0 0 var(--pc-d), -1px 0 0 var(--pc-d); white-space: nowrap; }
.pl .tags { position: absolute; right: 8px; top: -12px; display: flex; gap: 3px; }
.pl .tag { font: 900 12px/18px var(--f-ui); background: #fff; color: var(--pc-d); border: 2px solid var(--pc-d); border-radius: 9px; padding: 0 6px; }
.pl .money { position: absolute; left: 62px; right: 7px; bottom: 6px; height: 36px; background: #fff; border-radius: 8px; border: 2px solid var(--pc-d); font: 900 22px/1 var(--f-ui); color: var(--navy); display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl .money.neg { color: var(--red); }
.pl .cpu { position: absolute; left: 4px; bottom: 3px; font: 900 10px/14px var(--f-ui); color: #fff; background: rgba(0, 0, 0, .35); padding: 0 4px; border-radius: 6px; }
.pl .bear { position: absolute; left: 44px; top: -16px; width: 34px; height: 34px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .4)); }
.pl.turn { box-shadow: 0 0 0 2px var(--pc-d), 0 0 0 6px #ffe14d, 0 0 20px 8px rgba(255, 220, 60, .75); transform: translateY(-4px); }

/* ---------- マスコット ---------- */
#mascot { position: absolute; left: 1030px; top: 806px; width: 156px; height: 214px; pointer-events: none; }
#mascot .bubble { position: absolute; left: 0; top: 0; width: 152px; min-height: 58px; background: #fff; border: 3px solid var(--navy); border-radius: 18px; padding: 6px 6px; font: 900 15px/1.3 var(--f-ui); color: var(--red); text-align: center; transform: rotate(-5deg); box-shadow: 0 3px 0 rgba(0, 0, 0, .15); display: grid; place-items: center; }
#mascot .bubble::after { content: ''; position: absolute; right: 40px; bottom: -14px; border: 9px solid transparent; border-top: 12px solid var(--navy); }
#mascot .bubble::before { content: ''; position: absolute; right: 43px; bottom: -8px; border: 6px solid transparent; border-top: 9px solid #fff; z-index: 1; }
#mascot .mascot-body { position: absolute; right: 2px; bottom: 2px; width: 106px; }
#mascot .mascot-body img { width: 106px; height: auto; display: block; animation: sway 3s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .2)); }
@keyframes sway { 50% { transform: rotate(-3deg) translateY(-2px); } }

/* ---------- メッセージ・サイコロ・バナー ---------- */
#msg { position: absolute; left: 330px; top: 782px; width: 700px; min-height: 128px; background: linear-gradient(#2c58c4, #142f7d); border: 4px solid #fff; border-radius: 16px; box-shadow: 0 0 0 3px #0b1a45, 0 10px 26px rgba(0, 0, 0, .45); color: #fff; padding: 18px 26px 18px 118px; font: 800 22px/1.5 var(--f-ui); cursor: pointer; z-index: 30; animation: msg-in .18s ease-out; }
@keyframes msg-in { from { transform: translateY(14px); opacity: 0; } }
#msg .who-face { position: absolute; left: 14px; top: 16px; width: 88px; height: 88px; border-radius: 16px; background: radial-gradient(#fff, #dce9ff); border: 3px solid #0b1a45; display: grid; place-items: center; overflow: hidden; }
#msg .who { position: absolute; left: 112px; top: -18px; padding: 2px 14px; border-radius: 12px; border: 3px solid #fff; font: 900 17px/1.4 var(--f-ui); box-shadow: 0 0 0 2px #0b1a45; }
#msg .who:empty { display: none; }
#msg .txt b { color: #ffe14d; }
#msg .txt .minus { color: #ff9c94; }
#msg .next { position: absolute; right: 16px; bottom: 6px; font-size: 18px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

#dice { position: absolute; left: 300px; top: 320px; width: 880px; height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; pointer-events: none; z-index: 25; }
#dice .row { display: flex; gap: 16px; }
.die { width: 92px; height: 92px; background: linear-gradient(#fff, #eef2f8); border-radius: 20px; border: 4px solid var(--navy); box-shadow: 0 6px 0 #8fa3c2, 0 12px 22px rgba(0, 0, 0, .35); position: relative; }
.die i { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--navy); transform: translate(-50%, -50%); }
.die i.one { width: 26px; height: 26px; background: var(--red); }
.die.rolling { animation: tumble .22s linear infinite; }
@keyframes tumble { 25% { transform: rotate(14deg) translateY(-12px); } 75% { transform: rotate(-14deg) translateY(-4px); } }
.die.land { animation: land .3s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes land { from { transform: scale(1.35); } }
#dice .sum { font: 400 46px var(--f-pop); color: #fff; padding: 2px 26px; background: var(--red); border: 4px solid #fff; border-radius: 30px; box-shadow: 0 0 0 3px #6b0b0b, 0 6px 14px rgba(0, 0, 0, .35); animation: land .3s cubic-bezier(.2, 1.8, .4, 1); }

#banner { position: absolute; left: 300px; top: 370px; width: 880px; display: flex; justify-content: center; pointer-events: none; z-index: 28; }
#banner .bn { padding: 12px 44px 16px; background: linear-gradient(#fff27f, #f5b800); border: 5px solid #fff; border-radius: 24px; box-shadow: 0 0 0 4px #7a4a00, 0 12px 26px rgba(0, 0, 0, .35); text-align: center; animation: pop-in .38s cubic-bezier(.2, 1.6, .4, 1); }
#banner .bn-main { font: 400 50px/1.15 var(--f-pop); color: #d0161b; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 6px 0 rgba(122, 74, 0, .35); white-space: nowrap; }
#banner .bn-sub { font: 900 21px var(--f-ui); color: #5a3400; margin-top: 2px; }
#banner.out .bn { animation: pop-out .25s ease-in forwards; }
@keyframes pop-in { from { transform: scale(.3); opacity: 0; } }
@keyframes pop-out { to { transform: scale(.6); opacity: 0; } }

#hint { position: absolute; left: 330px; top: 20px; width: 700px; display: flex; justify-content: center; pointer-events: none; z-index: 26; }
#hint span { background: rgba(20, 40, 100, .9); color: #fff; font: 900 20px var(--f-ui); padding: 8px 22px; border-radius: 22px; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
#hint b { color: #ffe14d; }

/* ---------- ダイアログ ---------- */
#modal { position: absolute; inset: 0; background: rgba(10, 25, 60, .5); display: flex; align-items: center; justify-content: center; z-index: 50; }
.dlg { width: 780px; max-height: 940px; background: var(--cream); border: 4px solid var(--gold); border-radius: 20px; box-shadow: 0 0 0 3px var(--gold-dk), 0 18px 40px rgba(0, 0, 0, .45); display: flex; flex-direction: column; overflow: hidden; animation: pop-in .25s cubic-bezier(.2, 1.4, .4, 1); }
.dlg.wide { width: 1100px; }
.dlg-h { background: linear-gradient(var(--navy-hi), var(--navy-lo)); color: #fff; font: 900 27px var(--f-ui); padding: 12px 22px; display: flex; align-items: center; gap: 12px; }
.dlg-h .sub { margin-left: auto; font-size: 18px; color: #ffe14d; }
.dlg-b { padding: 16px 22px; overflow: auto; font-size: 18px; }
.dlg-f { padding: 10px 22px 18px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.btn { font: 900 21px var(--f-ui); padding: 10px 26px; border-radius: 14px; border: 3px solid #0d1f4a; background: linear-gradient(#5aa0ff, #1656c8); color: #fff; box-shadow: 0 4px 0 #0d1f4a; cursor: pointer; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d1f4a; }
.btn.red { background: linear-gradient(#f4524a, #c81e1e); border-color: #6b0b0b; box-shadow: 0 4px 0 #6b0b0b; }
.btn.green { background: linear-gradient(#4fd075, #1c8a3c); border-color: #0d4a1e; box-shadow: 0 4px 0 #0d4a1e; }
.btn.gray { background: linear-gradient(#f4f6fa, #c9d2df); color: var(--navy); border-color: #6b7690; box-shadow: 0 4px 0 #6b7690; text-shadow: none; }
.btn.small { font-size: 16px; padding: 6px 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; filter: grayscale(.4); }

.ptable { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 18px; }

img.bear3d { display: block; }

#bearpop { position: absolute; left: 610px; top: 230px; width: 260px; display: flex; justify-content: center; pointer-events: none; z-index: 29; }

  18% { transform: translateY(-24px) scale(1.08); opacity: 1; }

/* 信州 道の駅すごろく — イラスト描画（背景キャンバス・キャラクター・アイコン） */

const STAGE_W = 1536, STAGE_H = 1024;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 点列をなめらかな曲線(Catmull-Rom)のSVGパスに
function smoothPath(pts, closed = true) {
  const n = pts.length;
  const P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0]},${pts[0][1]}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)},${c2[0].toFixed(1)},${c2[1].toFixed(1)},${p2[0]},${p2[1]}`;
  }
  return closed ? d + 'Z' : d;
}

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function drawPeak(ctx, x, base, w, h, pal, rnd, snowFrac = 0.4) {
  const top = base - h;
  const L = x - w / 2, R = x + w / 2;
  const pk = x + (rnd() - 0.5) * w * 0.12;
  // 稜線
  const left = [[L, base]];
  const nL = 3;
  for (let i = 1; i < nL; i++) {
    const t = i / nL;
    left.push([L + (pk - L) * t + (rnd() - 0.5) * w * 0.05, base - h * Math.pow(t, 1.15) + (rnd() - 0.5) * h * 0.08]);
  }
  const right = [];
  for (let i = 1; i < nL; i++) {
    const t = i / nL;
    right.push([pk + (R - pk) * t + (rnd() - 0.5) * w * 0.05, top + h * Math.pow(t, 0.9) + (rnd() - 0.5) * h * 0.08]);
  }
  const outline = [...left, [pk, top], ...right, [R, base]];
  ctx.beginPath();
  outline.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  ctx.fillStyle = pal.lit; ctx.fill();
  ctx.save(); ctx.clip();
  // 影側
  ctx.beginPath();
  ctx.moveTo(pk, top - 2);
  ctx.lineTo(R + 2, base);
  ctx.lineTo(pk + w * 0.06, base);
  ctx.lineTo(pk + w * 0.02, top + h * 0.55);
  ctx.lineTo(pk - w * 0.04, top + h * 0.35);
  ctx.closePath();
  ctx.fillStyle = pal.dark; ctx.fill();
  // 谷筋
  ctx.strokeStyle = pal.dark; ctx.lineWidth = Math.max(1, w * 0.012);
  for (let i = 0; i < 3; i++) {
    const sx = pk - w * (0.08 + i * 0.1);
    ctx.beginPath(); ctx.moveTo(sx, top + h * (0.25 + i * 0.12)); ctx.lineTo(sx - w * 0.06, base); ctx.stroke();
  }
  if (pal.cap) {
    const sl = top + h * snowFrac;
    ctx.beginPath();
    ctx.moveTo(L - 5, top - 5);
    ctx.lineTo(R + 5, top - 5);
    ctx.lineTo(R + 5, sl);
    const steps = 7;
    for (let i = steps; i >= 0; i--) {
      const xx = L + (R - L) * i / steps;
      ctx.lineTo(xx, sl + (i % 2 ? h * 0.12 : -h * 0.02) + (rnd() - 0.5) * h * 0.06);
    }
    ctx.closePath();
    ctx.fillStyle = pal.cap; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.beginPath();
    ctx.moveTo(pk, top - 2); ctx.lineTo(R + 2, base); ctx.lineTo(pk + w * 0.05, base); ctx.lineTo(pk + w * 0.01, top + h * 0.5); ctx.closePath();
    ctx.fillStyle = pal.capDark; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();
  outline.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
}

function drawConifer(ctx, x, y, s, c1 = '#2c7637', c2 = '#3f9446') {
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - s * 0.12, y - s * 0.3, s * 0.24, s * 0.35);
  ctx.beginPath(); ctx.moveTo(x, y - s * 2.3); ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.lineTo(x + s * 0.8, y - s * 0.2); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y - s * 2.3); ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.lineTo(x - s * 0.05, y - s * 0.2); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill();
}
function drawRoundTree(ctx, x, y, s, c1 = '#4c9b3a', c2 = '#72bd55') {
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - s * 0.14, y - s * 0.6, s * 0.28, s * 0.65);
  ctx.beginPath(); ctx.arc(x, y - s * 1.2, s, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath(); ctx.arc(x - s * 0.3, y - s * 1.5, s * 0.5, 0, Math.PI * 2); ctx.fillStyle = c2; ctx.fill();
}

function strokeRiver(ctx, pts, w = 7) {
  const p = new Path2D(smoothPath(pts, false));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#3f8fd0'; ctx.lineWidth = w + 2.5; ctx.stroke(p);

function drawLake(ctx, x, y, rx, ry, rot = 0) {

const BASINS = [
  { x: 835, y: 225, rx: 85, ry: 55 },   // 善光寺平
  { x: 900, y: 125, rx: 50, ry: 45 },   // 飯山
  { x: 600, y: 410, rx: 70, ry: 95 },   // 松本平・安曇野

];
function inBasin(x, y, pad = 1) {
  for (const b of BASINS) { const dx = (x - b.x) / (b.rx * pad), dy = (y - b.y) / (b.ry * pad); if (dx * dx + dy * dy < 1) return true; }
  return false;
}

function paintBackground(canvas, k) {
  canvas.width = Math.round(STAGE_W * k); canvas.height = Math.round(STAGE_H * k);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const rnd = mulberry32(20261009);
  const pref = new Path2D(PREF_PATH_D);

  // 空
  let g = ctx.createLinearGradient(0, 0, 0, 420);
  g.addColorStop(0, '#8fcff1'); g.addColorStop(1, '#d9f0fa');
  ctx.fillStyle = g; ctx.fillRect(0, 0, STAGE_W, STAGE_H);

  // 遠くの山並み（上端）
  for (let x = -80; x < STAGE_W + 80; x += 60 + rnd() * 50) drawPeak(ctx, x, 175 + rnd() * 25, 140 + rnd() * 90, 120 + rnd() * 70, MT_PAL.far, rnd, 0.45);
  // 外側の大地
  ctx.beginPath(); ctx.moveTo(0, 190);
  for (let x = 0; x <= STAGE_W; x += 40) ctx.lineTo(x, 175 + Math.sin(x / 90) * 10 + rnd() * 8);
  ctx.lineTo(STAGE_W, STAGE_H); ctx.lineTo(0, STAGE_H); ctx.closePath();
  g = ctx.createLinearGradient(0, 180, 0, STAGE_H); g.addColorStop(0, '#a8d98a'); g.addColorStop(1, '#86c467');
  ctx.fillStyle = g; ctx.fill();

  // 外側の山々（左側・右下・上部）

  const mts = [];
  const addMts = (x0, x1, y0, y1, count, wmin, wmax, pal, snow) => {
    for (let i = 0; i < count; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (outside(x, y - 20)) mts.push({ x, y, w: wmin + rnd() * (wmax - wmin), pal, snow });
    }
  };
  addMts(-40, 360, 200, 1040, 34, 120, 220, MT_PAL.snow, 0.42);
  addMts(-40, 480, 120, 300, 10, 130, 220, MT_PAL.snow, 0.4);
  addMts(860, 1220, 600, 1040, 20, 110, 200, MT_PAL.snow, 0.42);
  addMts(1120, 1220, 80, 620, 10, 90, 150, MT_PAL.snow, 0.4);
  addMts(460, 1000, 40, 110, 10, 90, 150, MT_PAL.snow, 0.45);
  addMts(-40, 360, 300, 1040, 18, 90, 150, MT_PAL.green, 0);
  addMts(860, 1220, 640, 1040, 10, 90, 150, MT_PAL.green, 0);
  mts.sort((a, b) => a.y - b.y).forEach(m => drawPeak(ctx, m.x, m.y, m.w, m.w * (0.55 + rnd() * 0.25), m.pal, rnd, m.snow));

  // 富士山
  ctx.save();
  ctx.beginPath(); ctx.moveTo(865, 860); ctx.lineTo(958, 720); ctx.quadraticCurveTo(975, 708, 992, 720); ctx.lineTo(1095, 860); ctx.closePath();
  g = ctx.createLinearGradient(0, 700, 0, 860); g.addColorStop(0, '#6f86b8'); g.addColorStop(1, '#4b6aa3');
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  ctx.beginPath(); ctx.moveTo(940, 700); ctx.lineTo(1010, 700); ctx.lineTo(1022, 760); ctx.lineTo(1006, 752); ctx.lineTo(996, 770); ctx.lineTo(982, 754); ctx.lineTo(968, 772); ctx.lineTo(955, 752); ctx.lineTo(940, 764); ctx.lineTo(928, 760); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  drawLake(ctx, 905, 872, 30, 10, -0.1);

  // 外側の森
  for (let i = 0; i < 900; i++) {
    const x = rnd() * 1200, y = 160 + rnd() * 880;
    if (!outside(x, y)) continue;
    const s = 3.5 + rnd() * 3.5;
    rnd() < 0.6 ? drawConifer(ctx, x, y, s, '#3d8a45', '#56a453') : drawRoundTree(ctx, x, y, s * 0.9, '#5aa846', '#80c662');
  }

  // ---- 長野県 ----
  ctx.save();
  ctx.shadowColor = 'rgba(40,70,20,.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#6cb646'; ctx.fill(pref);
  ctx.restore();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#f4ef8c'; ctx.lineWidth = 16; ctx.stroke(pref);
  ctx.strokeStyle = '#d7e866'; ctx.lineWidth = 7; ctx.stroke(pref);

  ctx.save(); ctx.clip(pref);
  g = ctx.createLinearGradient(300, 40, 1160, 940); g.addColorStop(0, '#79c24f'); g.addColorStop(1, '#5aa83c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, STAGE_W, STAGE_H);

  // 盆地（明るい田畑）
  for (const b of BASINS) {
    const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(b.rx, b.ry));
    rg.addColorStop(0, 'rgba(204,232,128,.95)'); rg.addColorStop(0.7, 'rgba(184,222,110,.6)'); rg.addColorStop(1, 'rgba(184,222,110,0)');
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.rx / Math.max(b.rx, b.ry), b.ry / Math.max(b.rx, b.ry)); ctx.translate(-b.x, -b.y);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(b.rx, b.ry), 0, Math.PI * 2); ctx.fill(); ctx.restore();
    const fieldCols = ['#d9ea8a', '#c4e07a', '#e8ec9c', '#acd468', '#f0e59a'];
    for (let i = 0; i < 26; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 0.75;
      const fx = b.x + Math.cos(a) * b.rx * r, fy = b.y + Math.sin(a) * b.ry * r;
      ctx.save(); ctx.translate(fx, fy); ctx.rotate((rnd() - 0.5) * 0.5);
      ctx.fillStyle = fieldCols[i % fieldCols.length]; ctx.globalAlpha = 0.85;
      ctx.fillRect(-7 - rnd() * 5, -4 - rnd() * 3, 14 + rnd() * 8, 8 + rnd() * 5);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // 川
  strokeRiver(ctx, [[1062, 600], [1040, 545], [1012, 482], [962, 432], [930, 372], [884, 330], [842, 290], [826, 250], [852, 200], [878, 150], [905, 100], [955, 48], [990, 0]], 7); // 千曲川
  strokeRiver(ctx, [[565, 445], [602, 386], [655, 335], [718, 302], [786, 272], [826, 252]], 5.5); // 犀川
  strokeRiver(ctx, [[415, 446], [480, 434], [535, 440], [565, 445]], 4); // 梓川
  strokeRiver(ctx, [[560, 250], [572, 190], [590, 120], [602, 40]], 4); // 姫川
  strokeRiver(ctx, [[738, 598], [700, 628], [662, 668], [640, 722], [618, 782], [598, 842], [612, 905], [640, 970]], 6.5); // 天竜川
  strokeRiver(ctx, [[505, 548], [478, 598], [455, 652], [432, 720], [408, 782], [376, 842], [338, 900], [300, 960]], 5.5); // 木曽川
  drawLake(ctx, 742, 604, 30, 17, -0.25);  // 諏訪湖
  drawLake(ctx, 703, 86, 11, 9);           // 野尻湖
  drawLake(ctx, 532, 268, 6, 11, 0.2);     // 木崎湖
  drawLake(ctx, 900, 552, 8, 6);           // 白樺湖

  // 県内の山々
  const inner = [];
  const ridge = (pts, n, wmin, wmax, pal, snow, jitter = 18) => {
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), seg = t * (pts.length - 1), j = Math.min(pts.length - 2, Math.floor(seg)), f = seg - j;
      const x = pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f + (rnd() - 0.5) * jitter;
      const y = pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f + (rnd() - 0.5) * jitter;
      inner.push({ x, y, w: wmin + rnd() * (wmax - wmin), pal, snow });
    }
  };
  ridge([[505, 120], [478, 220], [458, 320], [432, 420], [405, 500]], 14, 60, 95, MT_PAL.snow, 0.42); // 北アルプス
  ridge([[372, 560], [392, 600]], 2, 85, 100, MT_PAL.snow, 0.45, 6); // 御嶽山
  ridge([[525, 650], [540, 720], [532, 790]], 6, 50, 70, MT_PAL.snow, 0.42); // 中央アルプス
  ridge([[812, 620], [818, 700], [826, 790], [826, 860]], 8, 55, 80, MT_PAL.snow, 0.42); // 南アルプス
  ridge([[965, 575], [1010, 590]], 4, 50, 70, MT_PAL.snow, 0.45); // 八ヶ岳
  ridge([[660, 70], [790, 70]], 4, 50, 70, MT_PAL.snow, 0.45, 8); // 妙高・戸隠
  ridge([[1015, 140], [1110, 110]], 3, 50, 70, MT_PAL.snow, 0.45, 8); // 北信の山
  ridge([[1040, 200], [1130, 205]], 4, 45, 60, MT_PAL.green, 0, 8); // 志賀高原
  ridge([[720, 430], [760, 490]], 3, 45, 60, MT_PAL.green, 0, 8); // 美ヶ原
  ridge([[440, 870], [500, 880], [720, 930]], 6, 50, 70, MT_PAL.green, 0, 10);
  ridge([[770, 380], [690, 370]], 3, 40, 55, MT_PAL.green, 0, 8);
  ridge([[1120, 600], [1150, 540]], 2, 40, 60, MT_PAL.green, 0, 8);
  inner.sort((a, b) => a.y - b.y).forEach(m => drawPeak(ctx, m.x, m.y, m.w, m.w * 0.62, m.pal, rnd, m.snow));
  // 浅間山
  drawPeak(ctx, 1128, 336, 92, 64, MT_PAL.snow, rnd, 0.35);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  [[1128, 262, 8], [1136, 252, 10], [1148, 240, 12]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });

  // 森
  for (let i = 0; i < 3600; i++) {
    const x = 290 + rnd() * 890, y = 40 + rnd() * 910;
    if (!pointInPoly(x, y, PREF_OUTLINE)) continue;
    const basin = inBasin(x, y, 0.9);
    if (basin && rnd() < 0.85) continue;
    const s = 3.6 + rnd() * 3.6;
    if (rnd() < 0.55) drawConifer(ctx, x, y, s); else drawRoundTree(ctx, x, y, s * 0.85);
  }
  ctx.restore();

  ctx.strokeStyle = '#3f7d2b'; ctx.lineWidth = 2.2; ctx.stroke(pref);
}

function paintVignette(canvas) {

  canvas.width = w * k; canvas.height = h * k;
  const ctx = canvas.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
  const rnd = mulberry32(77);
  let g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8fd0f2'); g.addColorStop(0.55, '#e3f4fb'); g.addColorStop(1, '#e3f4fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  drawLake(ctx, 78, 150, 52, 14);

  }
}

/* 全体図（エリア塗り分け） */
function paintMinimap(canvas, w, h) {
  const k = 2;
  canvas.width = w * k; canvas.height = h * k;
  const ctx = canvas.getContext('2d');
  const xs = PREF_OUTLINE.map(p => p[0]), ys = PREF_OUTLINE.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sc = Math.min((w - 12) / (x1 - x0), (h - 12) / (y1 - y0));
  const ox = (w - (x1 - x0) * sc) / 2, oy = (h - (y1 - y0) * sc) / 2;
  const toStage = (px, py) => [x0 + (px / k - ox) / sc, y0 + (py / k - oy) / sc];
  const img = ctx.createImageData(canvas.width, canvas.height);
  const areaIdx = new Int8Array(canvas.width * canvas.height).fill(-1);
  const pts = STATIONS.map(s => [s.x, s.y, AREA_ORDER.indexOf(s.area)]);
  const cols = AREA_ORDER.map(a => {
    const c = AREAS[a].color; return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  });
  for (let py = 0; py < canvas.height; py++) {
    for (let px = 0; px < canvas.width; px++) {
      const [sx, sy] = toStage(px, py);
      if (!pointInPoly(sx, sy, PREF_OUTLINE)) continue;
      let best = 1e9, bi = 0;
      for (const p of pts) { const d = (p[0] - sx) ** 2 + (p[1] - sy) ** 2; if (d < best) { best = d; bi = p[2]; } }
      areaIdx[py * canvas.width + px] = bi;
    }
  }
  for (let py = 0; py < canvas.height; py++) {
    for (let px = 0; px < canvas.width; px++) {
      const i = py * canvas.width + px, a = areaIdx[i];
      if (a < 0) continue;
      const r = px + 1 < canvas.width ? areaIdx[i + 1] : a, d = py + 1 < canvas.height ? areaIdx[i + canvas.width] : a;
      const edge = (r !== a && r >= 0) || (d !== a && d >= 0);
      const c = edge ? [255, 255, 255] : cols[a];
      img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.setTransform(k * sc, 0, 0, k * sc, k * (ox - x0 * sc), k * (oy - y0 * sc));
  ctx.lineWidth = 2.2 / sc; ctx.strokeStyle = '#ffffff'; ctx.stroke(new Path2D(PREF_PATH_D));
  return { sc, ox, oy, x0, y0 };
}

/* 信州 道の駅すごろく — ボード（路線グラフ構築と地図SVG描画） */

const SVGNS = 'http://www.w3.org/2000/svg';
const LABEL_FONT = '800 13px "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';
const LABEL_MAX_TEXT = 94;

const Board = {
  nodes: [], adj: [], stNode: {}, hubNode: {}, edges: [],
  stById: Object.fromEntries(STATIONS.map(s => [s.id, s])),
  hubById: Object.fromEntries(HUBS.map(h => [h.id, h])),
};

function svgEl(tag, attrs = {}, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

function buildBoard() {
  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = LABEL_FONT;
  const B = Board;
  B.nodes = []; B.adj = []; B.edges = [];
  const add = n => { n.i = B.nodes.length; B.nodes.push(n); B.adj.push([]); return n.i; };

  // ラベル幅は文字数から決める（フォントの読み込み状況でマス配置が変わらないように）
  for (const s of STATIONS) {
    const est = [...s.n].reduce((a, ch) => a + (ch.charCodeAt(0) < 128 ? 8.2 : 13.2), 0);
    const textW = Math.min(est, LABEL_MAX_TEXT);
    const w = Math.round(28 + textW + 9);
    const tw = mctx.measureText(s.n).width;
    B.stNode[s.id] = add({ kind: 'station', sid: s.id, x: s.x, y: s.y, w, h: 26, textW, squeeze: tw > textW + 0.5 });
  }
  for (const h of HUBS) B.hubNode[h.id] = add({ kind: 'hub', hid: h.id, x: h.x, y: h.y, w: 32, h: 32 });

  const nodeOf = key => typeof key === 'number' ? B.stNode[key] : B.hubNode[key];
  const rnd = mulberry32(5454);
  const pickType = () => { const r = rnd(); return r < 0.5 ? 'blue' : r < 0.75 ? 'red' : 'yellow'; };

  for (const [ka, kb, bend = 0] of EDGES) {
    const a = B.nodes[nodeOf(ka)], b = B.nodes[nodeOf(kb)];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const cx = (a.x + b.x) / 2 + (-dy / len) * bend, cy = (a.y + b.y) / 2 + (dx / len) * bend;
    const N = 160, pts = [], acc = [0];
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      pts.push([u * u * a.x + 2 * u * t * cx + t * t * b.x, u * u * a.y + 2 * u * t * cy + t * t * b.y]);
      if (i) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const inside = (n, p, pad) => Math.abs(p[0] - n.x) <= n.w / 2 + pad && Math.abs(p[1] - n.y) <= n.h / 2 + pad;
    let i0 = 0; while (i0 < N && inside(a, pts[i0], 1)) i0++;
    let i1 = N; while (i1 > 0 && inside(b, pts[i1], 1)) i1--;
    const L = Math.max(0, acc[i1] - acc[i0]);
    const k = Math.max(0, Math.floor(L / 23) - 1);
    const chain = [a.i];
    for (let j = 1; j <= k; j++) {
      const target = acc[i0] + L * j / (k + 1);
      let idx = i0; while (idx < i1 && acc[idx] < target) idx++;
      chain.push(add({ kind: 'sq', type: pickType(), x: pts[idx][0], y: pts[idx][1], w: 20, h: 20 }));
    }
    chain.push(b.i);
    for (let j = 0; j < chain.length - 1; j++) { B.adj[chain[j]].push(chain[j + 1]); B.adj[chain[j + 1]].push(chain[j]); }
    B.edges.push({ a: a.i, b: b.i, chain, d: `M${a.x},${a.y}Q${cx.toFixed(1)},${cy.toFixed(1)},${b.x},${b.y}` });
  }
  // 連続する赤マスを減らす
  for (const e of B.edges) {
    for (let j = 1; j < e.chain.length - 1; j++) {
      const n = B.nodes[e.chain[j]], prev = B.nodes[e.chain[j - 1]];
      if (n.type === 'red' && prev.type === 'red') n.type = 'blue';
    }
  }
}

/* 最短距離(BFS) */
function bfsFrom(start) {
  const dist = new Array(Board.nodes.length).fill(Infinity);
  dist[start] = 0; const q = [start];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    for (const v of Board.adj[u]) if (dist[v] === Infinity) { dist[v] = dist[u] + 1; q.push(v); }
  }
  return dist;
}

/* サイコロの目でちょうど止まれるマス（双六と同じく、目的地もぴったりの目でしか止まれない） */
function reachable(start, steps) {
  const result = new Map(); // node -> path
  let layer = [{ node: start, prev: -1, path: [start] }];
  for (let s = 1; s <= steps; s++) {
    const next = new Map();
    for (const st of layer) {
      const nbs = Board.adj[st.node];
      for (const nb of nbs) {
        if (nb === st.prev && nbs.length > 1) continue;
        const key = nb + ':' + st.node;
        if (!next.has(key)) next.set(key, { node: nb, prev: st.node, path: st.path.concat(nb) });
      }
    }
    layer = [...next.values()];
  }
  for (const st of layer) if (!result.has(st.node)) result.set(st.node, st.path);
  return result;
}

/* 信州 道の駅すごろく — 効果音（WebAudioで合成） */
const Sound = {
  on: true, ctx: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    if (this.ctx && typeof Music !== 'undefined') Music.update();   // 最初のタップでBGMも始める
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.05, when = 0, slideTo = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, type = 'square', vol = 0.05, step = 0.09) { notes.forEach((f, i) => f && this.tone(f, step * 1.1, type, vol, i * step)); },
  play(name) {
    if (this.ctx && typeof Music !== 'undefined' && (name === 'fanfare' || name === 'kessan')) Music.duck(1.8);   // ファンファーレの間はBGMを小さく
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'click': this.tone(880, 0.05, 'square', 0.04); break;
      case 'step': this.tone(660, 0.05, 'triangle', 0.06); this.tone(990, 0.04, 'triangle', 0.03, 0.03); break;
      case 'dice': for (let i = 0; i < 9; i++) this.tone(300 + Math.random() * 500, 0.03, 'square', 0.03, i * 0.08); break;
      case 'coin': this.seq([988, 1319], 'square', 0.05, 0.08); break;
      case 'bad': this.seq([392, 330, 262, 196], 'sawtooth', 0.04, 0.12); break;
      case 'card': this.seq([784, 988, 1175, 1568], 'triangle', 0.06, 0.06); break;
      case 'buy': this.seq([523, 659, 784, 1047], 'square', 0.045, 0.07); break;
      case 'stamp': this.tone(180, 0.12, 'square', 0.08); this.tone(1200, 0.08, 'triangle', 0.05, 0.08); break;
      case 'fanfare': this.seq([523, 523, 523, 659, 0, 587, 659, 784, 784, 1047], 'square', 0.05, 0.11); this.seq([262, 0, 262, 330, 0, 294, 330, 392, 392, 523], 'triangle', 0.05, 0.11); break;
      case 'bear': this.seq([196, 185, 175, 165, 156], 'sawtooth', 0.045, 0.14); break;
      case 'warp': this.tone(300, 0.5, 'sine', 0.07, 0, 1600); break;
      case 'month': this.seq([659, 784, 1047], 'triangle', 0.06, 0.09); break;
      case 'kessan': this.seq([392, 523, 659, 784, 1047, 784, 1047], 'square', 0.045, 0.1); break;
    }
  },
};

/* 信州 道の駅すごろく — BGM
   曲はすべてこのゲームのためのオリジナル。音声ファイルは使わず、WebAudio で
   メロディ・ベース・和音・ドラムをその場で演奏する（効果音と同じ AudioContext を使う）。
   場面（タイトル／季節／ボンビーぐま／決算）に合わせて、なめらかに曲を切りかえる。 */

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(tok);
  if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
// 楽譜の1文字（音名・ - のばす・ . 休み）を16分音符いくつ分に広げるか
function expandScore(str, mult) {
  const out = [];
  for (const t of str.trim().split(/\s+/)) {
    if (t === '|') continue;
    out.push(t);
    for (let i = 1; i < mult; i++) out.push(t === '.' ? '.' : '-');
  }
  return out;
}
function compileVoice(tokens) {
  const ev = new Array(tokens.length).fill(null);
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === '-' || t === '.') continue;
    let d = 1; while (i + d < tokens.length && tokens[i + d] === '-') d++;
    ev[i] = { f: noteFreq(t), d };
  }
  return ev;
}
const CHORD_TONES = {
  C: ['C4', 'E4', 'G4'], 'C/E': ['G3', 'C4', 'E4'], G: ['B3', 'D4', 'G4'], 'G/B': ['B3', 'D4', 'G4'], Am: ['A3', 'C4', 'E4'], F: ['A3', 'C4', 'F4'],
  Em: ['B3', 'E4', 'G4'], Dm: ['A3', 'D4', 'F4'], D: ['A3', 'D4', 'F#4'], E7: ['G#3', 'D4', 'E4'], Bb: ['Bb3', 'D4', 'F4'],
};

// lead: 8分音符で1小節8つ ／ bass: bassMult（4=4分音符, 2=8分音符） ／ chords: 半小節ごとの和音 ／ drums: 1小節16文字
const SONGS = {

function compileSong(name, flavor) {
  const base = SONGS[name], fl = (base.flavors && base.flavors[flavor]) || {};
  const s = { ...base, ...fl };
  const lead = compileVoice(expandScore(s.lead, 2));
  const bass = compileVoice(expandScore(s.bass, s.bassMult));
  const chords = s.chords.split(/\s+/).map(c => (CHORD_TONES[c] || []).map(noteFreq));
  return { ...s, lead, bass, chords, len: lead.length, stepDur: 60 / s.bpm / 4 };
}

const Music = {
  on: true, vol: 0.16, players: [], key: '', timer: null, override: null, master: null, echo: null, noise: null,
  ensure() {
    const ctx = Sound.ctx;
    if (!ctx) return false;
    if (!this.master) {
      this.master = ctx.createGain();
      this.master.gain.value = this.on ? this.vol : 0;
      this.master.connect(ctx.destination);
      // ふんわり響かせるエコー
      const d = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain();
      d.delayTime.value = 0.27; fb.gain.value = 0.26; wet.gain.value = 0.2;
      d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(this.master);
      this.echo = d;
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
    return true;
  },
  setOn(on) {
    this.on = on;
    if (!this.master) { if (on) this.update(true); return; }
    this.master.gain.setTargetAtTime(on ? this.vol : 0, Sound.ctx.currentTime, 0.15);
    if (on) this.update(true);
  },
  // いまの場面にあう曲
  want() {
    if (this.override) return this.override;
    const start = document.getElementById('start');
    if (typeof G === 'undefined' || !G || (start && !start.hidden)) return 'title';
    if (G.over) return 'kessan';
    if (G.bear !== null && G.bear === G.turn) return 'bear';
    const m = G.month;
    const season = m >= 4 && m <= 6 ? 'spring' : m >= 7 && m <= 9 ? 'summer' : m >= 10 && m <= 11 ? 'autumn' : 'winter';
    return 'field:' + season;
  },
  update(force) {
    if (!this.on || !Sound.ctx || !this.ensure()) return;
    const key = this.want();
    if (!force && key === this.key) return;
    this.key = key;
    this.play(key);
  },
  play(key) {
    const [name, flavor] = key.split(':');
    const ctx = Sound.ctx, now = ctx.currentTime;
    for (const p of this.players) if (!p.stopAt) { p.stopAt = now + 0.9; p.bus.gain.setTargetAtTime(0.0001, now, 0.22); }
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0.0001, now);
    bus.gain.setTargetAtTime(1, now + 0.05, 0.3);
    bus.connect(this.master);
    this.players.push({ song: compileSong(name, flavor), bus, step: 0, next: now + 0.1 });
  },
  tick() {
    const ctx = Sound.ctx;
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    this.players = this.players.filter(p => { if (p.stopAt && now > p.stopAt) { p.bus.disconnect(); return false; } return true; });
    for (const p of this.players) {
      if (p.stopAt) continue;
      if (p.next < now - 0.25) p.next = now + 0.05;   // バックグラウンドで止まっていたら、まとめて鳴らさず続きから
      while (p.next < now + 0.15) {
        this.schedule(p, p.step, p.next);
        p.next += p.song.stepDur;
        p.step = (p.step + 1) % p.song.len;
      }
    }
  },
  // ファンファーレなどのあいだ、BGMを小さくする
  duck(sec) {
    if (!this.master || !this.on) return;
    const g = this.master.gain, now = Sound.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setTargetAtTime(this.vol * 0.2, now, 0.05);
    g.setTargetAtTime(this.vol, now + sec, 0.35);
  },
  schedule(p, i, t) {
    const S = p.song, dur = S.stepDur, bus = p.bus;
    const lead = S.lead[i];
    if (lead) {
      this.tone(bus, S.leadType, lead.f, t, lead.d * dur * S.gate, 0.11, S.lp, true, S.vib);
      if (S.bell) this.tone(bus, 'sine', lead.f * 2, t, Math.min(lead.d * dur, 0.4), 0.035, 0, true, false);
    }
    const bass = S.bass[i];
    if (bass) this.tone(bus, 'triangle', bass.f, t, bass.d * dur * 0.92, 0.17, 0, false, false);
    const bi = i % 16;
    if (bi % 4 === 2) for (const f of S.chords[Math.floor(i / 8)] || []) this.tone(bus, 'square', f, t, dur * 1.3, 0.02, 1900, false, false);
    const D = S.drums;
    if (D.k[bi] === 'x') this.kick(bus, t);
    if (D.s[bi] === 'x') this.snare(bus, t);
    if (D.h[bi] === 'x') this.hat(bus, t);
  },
  tone(dest, type, f, t, len, gain, lp, echo, vib) {
    const ctx = Sound.ctx;
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (vib) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = f * 0.007;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 0.12); lfo.stop(t + len + 0.3);
    }
    let node = o;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.setTargetAtTime(gain * 0.65, t + 0.03, 0.09);
    g.gain.setTargetAtTime(0.0001, t + Math.max(0.03, len), 0.035);
    node.connect(g); g.connect(dest);
    if (echo) g.connect(this.echo);
    o.start(t); o.stop(t + len + 0.35);
  },
  kick(dest, t) {
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.42, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.22);
  },
  noiseHit(dest, t, hp, gain, len) {
    const ctx = Sound.ctx, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise; fl.type = 'highpass'; fl.frequency.value = hp;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(fl); fl.connect(g); g.connect(dest); src.start(t, Math.random() * 0.5); src.stop(t + len + 0.02);
  },
  snare(dest, t) {
    this.noiseHit(dest, t, 1500, 0.16, 0.13);
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(190, t);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.1);
  },
  hat(dest, t) { this.noiseHit(dest, t, 7000, 0.045, 0.035); },
};

/* ---------- 合言葉による暗号化（AES-GCM） ----------
   合言葉と部屋番号から PBKDF2（20万回）で「暗号のカギ」と「部屋の場所（トピック名）」をまとめて作る。
   部屋の場所からも合言葉を速く当てられないよう、どちらも同じ重い計算から取り出す。
   中継サーバーや合言葉を知らない人には、中身も部屋の場所もわからず、偽のデータも作れない。 */
const cryptoOk = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function roomSecrets(code, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(`shinshu-sugoroku|v3|${code}`), iterations: 200000, hash: 'SHA-256' }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  const topicId = [...bits.slice(32, 48)].map(b => b.toString(16).padStart(2, '0')).join('');
  return { topicId, key };
}
// aad（送り主の名前）も暗号に結びつけるので、他人の発言を別の人のものとして使い回せない
async function sealJson(key, obj, aad) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(aad) }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return b64(iv) + '.' + b64(ct);
}
async function openJson(key, text, aad) {
  const [iv, ct] = text.split('.');
  if (!iv || !ct) throw new Error('format');
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv), additionalData: new TextEncoder().encode(aad) }, key, unb64(ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 公開MQTTサーバー経由の部屋 ---------- */
const MQTT_SRC = ['https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.3/mqtt.min.js', 'https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js'];
// 読みこむライブラリの指紋。CDNの中身がすりかえられていたら読みこまない
const MQTT_SRI = 'sha384-2zQjVyInRn7TzkR04+eX+LIHdeOeDoi4HO1liY/ci1n9bXCb/nBziCckfkazOx6h';
const MQTT_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081', 'wss://broker.hivemq.com:8884/mqtt'];
const MQTT_ROOT = 'shinshu-michinoeki-sugoroku/v3';

function loadScript(src, integrity) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.async = true; el.integrity = integrity; el.crossOrigin = 'anonymous';
    el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
async function loadMqtt() {
  if (window.mqtt) return;
  for (const src of MQTT_SRC) { try { await loadScript(src, MQTT_SRI); if (window.mqtt) return; } catch (e) { /* 次を試す */ } }
  throw new Error('mqtt-load');
}
function mqttConnect(url, will) {
  return new Promise((resolve, reject) => {
    const c = window.mqtt.connect(url, {
      clientId: 'shinshu_' + Net.cid + '_' + Math.random().toString(36).slice(2, 6),
      clean: true, keepalive: 45, reconnectPeriod: 2000, connectTimeout: 7000, will,
    });
    const timer = setTimeout(() => fail(new Error('timeout')), 8000);
    function ok() { clearTimeout(timer); c.removeListener('error', fail); resolve(c); }
    function fail(e) { clearTimeout(timer); c.removeListener('connect', ok); try { c.end(true); } catch (x) { /* noop */ } reject(e); }
    c.once('connect', ok);
    c.once('error', fail);
  });
}
async function openMqttRoom(code, pass) {
  if (!cryptoOk()) throw new Error('no-crypto');
  const [{ topicId, key }] = await Promise.all([roomSecrets(code, pass), loadMqtt()]);
  const base = `${MQTT_ROOT}/${topicId}/p`;
  const me = Net.cid, myTopic = `${base}/${me}`;
  const aadOf = cid => `${MQTT_ROOT}|${topicId}|${cid}`;
  // 送る順番の番号（時刻ベース）と、この接続の識別子。古いデータの再送（リプレイ）を見分けるのに使う
  const session = b64(crypto.getRandomValues(new Uint8Array(9)));
  let seq = 0;
  const nextSeq = () => (seq = Math.max(seq + 1, Date.now()));
  // 回線が切れたときにサーバーが代わりに出す「退出」も暗号化しておく（他人が偽の退出を出せないように）
  const will = { topic: myTopic, payload: await sealJson(key, { s: session, q: 0, gone: 1 }, aadOf(me)), retain: true, qos: 1 };
  let client = null, err = null;
  for (const url of MQTT_BROKERS) { try { client = await mqttConnect(url, will); break; } catch (e) { err = e; } }
  if (!client) throw err || new Error('connect');

  const peers = new Map();   // cid -> {heard, obj}
  const seen = new Map();    // cid -> {s, q} 最後に受けとった接続と番号
  const handlers = new Set();
  let mine = {}, snap = Object.freeze([]), pubTimer = null, closed = false;
  let pubChain = Promise.resolve(), recvChain = Promise.resolve();
  const toPeer = (cid, presence) => Object.freeze({ peer: cid, by: null, isMe: cid === me, sameTab: cid === me, kind: 'viewer', guest: false, presence, updatedAt: Date.now() });
  const notify = () => {
    snap = Object.freeze([toPeer(me, Object.freeze(mine)), ...[...peers.values()].map(p => p.obj)]);
    handlers.forEach(h => { try { h({ peers: snap, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  };
  // 受信は順番どおりに1件ずつ復号する。合言葉が違う・改ざん・使い回し・古いデータは捨てる
  const receive = async (cid, buf) => {
    if (!buf || !buf.length || buf.length > 40000) return;   // 空のデータ（合言葉なしで誰でも送れる）は無視する
    let env;
    try { env = await openJson(key, new TextDecoder().decode(buf), aadOf(cid)); } catch (e) { return; }
    if (!env || typeof env !== 'object' || typeof env.s !== 'string' || !Number.isFinite(env.q)) return;
    const last = seen.get(cid);
    if (env.gone) {
      if (last && last.s === env.s && peers.delete(cid)) notify();   // いまの接続の「退出」だけを受けつける
      return;
    }
    if (last && env.q <= last.q) return;
    const pres = env.d;
    if (!pres || typeof pres !== 'object' || Array.isArray(pres)) return;
    seen.set(cid, { s: env.s, q: env.q });
    peers.set(cid, { heard: Date.now(), obj: toPeer(cid, Object.freeze(pres)) });
    notify();
  };
  client.on('message', (topic, buf) => {
    const cid = topic.slice(base.length + 1);
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(cid) || cid === me) return;
    recvChain = recvChain.then(() => receive(cid, buf)).catch(() => {});
  });
  // 送信も順番どおりに。最新の自分の状態を暗号化して出す
  const send = env => {
    pubChain = pubChain.then(async () => {
      if (!client.connected) return;
      const payload = await sealJson(key, env, aadOf(me));
      client.publish(myTopic, payload, { retain: true, qos: 0 });
    }).catch(e => console.warn('publish', e));
    return pubChain;
  };
  const publish = () => { pubTimer = null; if (!closed) send({ s: session, q: nextSeq(), d: mine }); };
  client.on('connect', publish);   // 再接続したら自分の状態を出しなおす
  await new Promise((resolve, reject) => client.subscribe(`${base}/+`, { qos: 0 }, e => (e ? reject(e) : resolve())));
  // 生存確認：30秒ごとに自分の状態を出しなおし、150秒音沙汰のない人はいないものとする
  const hb = setInterval(() => {
    if (Object.keys(mine).length) publish();
    const now = Date.now(); let changed = false;
    for (const [cid, p] of peers) if (now - p.heard > 150000) { peers.delete(cid); changed = true; }
    if (changed) notify();
  }, 30000);
  const leave = async () => {
    if (closed) return;
    closed = true; clearInterval(hb);
    await Promise.race([send({ s: session, q: nextSeq(), gone: 1 }), new Promise(r => setTimeout(r, 400))]);
    try { client.end(); } catch (e) { /* noop */ }
  };
  window.addEventListener('pagehide', () => { leave(); });
  notify();
  return {
    kind: 'mqtt',
    presence(patch) {
      const next = { ...mine };
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      mine = JSON.parse(JSON.stringify(next));
      if (!pubTimer) pubTimer = setTimeout(publish, 40);
      notify();
      return Promise.resolve();
    },
    peers: () => snap,
    onPeers(h) { handlers.add(h); setTimeout(() => h({ peers: snap, joined: snap, left: [], updated: [] }), 0); return () => handlers.delete(h); },
    connected: () => client.connected,
    leave,
  };
}

function cleanNick(s) {
  return String(s ?? '').replace(/[\u0000-\u001f\u007f-\u009f<>&"'`\u200b-\u200f\u2028-\u202e\u2066-\u2069]/g, '').trim().slice(0, 10) || 'ゲスト';
}
function rememberRoom(obj) { try { obj ? sessionStorage.setItem('shinshu-room', JSON.stringify(obj)) : sessionStorage.removeItem('shinshu-room'); } catch (e) { /* noop */ } }
function rememberedRoom() { try { return JSON.parse(sessionStorage.getItem('shinshu-room') || 'null'); } catch (e) { return null; } }

/* ---------- 状態のエンコード ---------- */
function encodeState(g) {
  return {
    y: g.year, m: g.month, t: g.turn, yr: g.years, d: g.dest, dd: g.destDist, b: g.bear ?? -1, ov: g.over ? 1 : 0, sd: g.started ? 1 : 0,
    o: PROP_KEYS.map(k => (g.owners[k] === undefined ? '-' : String(g.owners[k]))).join(''),
    ps: g.players.map(p => [p.money, p.pos, p.cards.map(c => CARD_CODE[c]).join(''), p.stamps.map(id => ID64[id]).join(''), p.slow ? 1 : 0, p.arrivals || 0]),
  };
}
function decodeState(s, seats) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.ps) || s.ps.length !== 4) return null;
  if (!isInt(s.y, 1, 10) || !isInt(s.m, 1, 12) || !isInt(s.t, 0, 3) || !isInt(s.yr, 1, 10)) return null;
  const nodes = Board.nodes.length;
  const g = {
    v: 1, years: s.yr, year: s.y, month: s.m, turn: s.t, started: !!s.sd, over: !!s.ov,
    dest: isInt(s.d, 1, STATIONS.length) && Board.stById[s.d] ? s.d : null, destDist: isInt(s.dd, 0, 999) ? s.dd : 0,
    bear: isInt(s.b, 0, 3) ? s.b : null, owners: {}, players: [],
  };
  const o = typeof s.o === 'string' ? s.o : '';
  PROP_KEYS.forEach((k, i) => { const c = o[i]; if (c >= '0' && c <= '3') g.owners[k] = +c; });
  for (let i = 0; i < 4; i++) {
    const a = s.ps[i];
    if (!Array.isArray(a) || !Number.isFinite(a[0]) || !isInt(a[1], 0, nodes - 1)) return null;
    const cards = [...String(a[2] || '')].map(c => CODE_CARD[c]).filter(Boolean).slice(0, 8);
    const stamps = [...new Set([...String(a[3] || '')].map(c => ID64.indexOf(c)).filter(id => Board.stById[id]))];
    g.players.push({ idx: i, human: !!seats[i], remote: false, money: Math.round(a[0]), pos: a[1], cards, stamps, slow: a[4] ? 1 : 0, arrivals: isInt(a[5], 0, 999) ? a[5] : 0 });
  }
  return g;
}

/* ---------- ホスト ---------- */
function hostPresence() {
  const base = {
    v: NET_V, role: 'host', code: Net.code, cid: Net.cid, nick: Net.nick, yr: Net.years, sp: Net.speed, go: Net.started ? 1 : 0,
    seats: Net.seats.map(s => (s ? [s.cid, s.nick] : 0)), pr: Net.prompt,
  };
  if (Net.started && G) { base.st = encodeState(G); base.sn = Net.seq; }
  const enc = new TextEncoder();
  let ev = Net.log.slice(-16);
  for (;;) {
    const obj = { ...base, ev };
    if (enc.encode(JSON.stringify(obj)).length <= 3800 || !ev.length) return obj;
    ev = ev.slice(1);
  }
}
function hostPush() {
  if (Net.mode !== 'host' || !Net.room) return;
  Net.room.presence(hostPresence()).catch(e => console.warn('presence', e && e.code));
}
// 演出イベントをゲストへ（ホストのときだけ）
function netEv(ev) {
  if (Net.mode !== 'host' || !Net.started) return;
  ev.n = ++Net.seq;
  Net.log.push(ev);
  if (Net.log.length > 40) Net.log.shift();
  hostPush();
}

async function netCreate(nick, pass) {
  const t = await netApi();
  if (!t) throw new Error('unavailable');
  let code = '', room = null;
  for (let tries = 0; tries < 5; tries++) {
    code = String(1000 + Math.floor(Math.random() * 9000));
    room = await t.open(code, pass);
    if (t.kind !== 'mqtt') break;
    await new Promise(r => setTimeout(r, 1500));   // 同じ番号の部屋がすでにないか確かめる
    const taken = room.peers().some(p => !p.isMe && p.presence && p.presence.role === 'host' && p.presence.code === code);
    if (!taken) break;
    await room.leave(); room = null;
  }
  if (!room) throw new Error('no-room');
  Object.assign(Net, {
    mode: 'host', room, code, nick: cleanNick(nick),
    seats: [{ cid: Net.cid, nick: cleanNick(nick) }, null, null, null], mySeat: 0, started: false, seq: 0, log: [], prompt: null,
  });
  rememberRoom(null);
  Net.pass = pass;
  room.onPeers(hostOnPeers);
  hostPush();
}

function hostOnPeers(ch) {
  if (Net.mode !== 'host') return;
  let changed = false;
  const present = new Set([Net.cid]);
  for (const peer of ch.peers) {
    if (peer.isMe && peer.sameTab) continue;
    const pr = peer.presence || {};
    if (pr.v !== NET_V || pr.role !== 'guest' || pr.code !== Net.code || typeof pr.cid !== 'string') continue;
    const cid = pr.cid.slice(0, 24);
    present.add(cid);
    const nick = cleanNick(pr.nick);
    let seat = Net.seats.findIndex(s => s && s.cid === cid);
    if (seat >= 0 && Net.seats[seat].nick !== nick) { Net.seats[seat].nick = nick; changed = true; }
    if (!Net.started) {
      const want = isInt(pr.want, -1, 3) ? pr.want : -1;
      if (want >= 0 && want !== seat && !Net.seats[want]) { if (seat >= 0) Net.seats[seat] = null; Net.seats[want] = { cid, nick }; seat = want; changed = true; }
      else if (want === -1 && seat >= 0) { Net.seats[seat] = null; changed = true; }
    }
    const ans = pr.ans;
    if (Net.waiter && Net.prompt && ans && typeof ans === 'object' && ans.n === Net.prompt.n) {
      const s = Net.seats[Net.prompt.s];
      if (s && s.cid === cid) Net.waiter(ans);
    }
  }
  if (!Net.started) Net.seats.forEach((s, i) => { if (s && !present.has(s.cid)) { Net.seats[i] = null; changed = true; } });
  Net.seats.forEach(s => { if (!s) return; if (present.has(s.cid)) delete Net.absentSince[s.cid]; else Net.absentSince[s.cid] = Net.absentSince[s.cid] || Date.now(); });
  const before = [...Net.present].sort().join(), after = [...present].sort().join();
  Net.present = present;
  if (changed) hostPush();
  if (changed || before !== after) { if (typeof renderLobby === 'function') renderLobby(); if (G && typeof refresh === 'function' && Net.started) refresh(); }
}

// ゲストに判断をたずねる。答えがない・席に人がいない時間が続くと null（CPUが代わりに判断）
function netAsk(seat, prompt, timeoutMs = 90000) {
  const gone = () => { const s = Net.seats[seat]; const since = s ? Net.absentSince[s.cid] : Date.now() - 1e6; return !s || (since && Date.now() - since > 20000); };
  if (gone()) return Promise.resolve(null);
  return new Promise(resolve => {
    Net.prompt = { n: ++Net.pn, s: seat, ...prompt };
    let done = false;
    const t0 = Date.now();
    const finish = v => { if (done) return; done = true; clearInterval(iv); Net.waiter = null; Net.prompt = null; hostPush(); resolve(v); };
    Net.waiter = ans => finish(ans);
    const iv = setInterval(() => { if (gone() || Date.now() - t0 > timeoutMs) finish(null); }, 1000);
    hostPush();
  });
}

/* ---------- ゲスト ---------- */
function guestPush(extra = {}) {
  if (!Net.room) return;
  Net.room.presence({ v: NET_V, role: 'guest', code: Net.code, cid: Net.cid, nick: Net.nick, want: Net.want, ...extra }).catch(e => console.warn('presence', e && e.code));
}
async function netJoin(code, nick, pass) {
  const t = await netApi();
  if (!t) throw new Error('unavailable');
  const room = await t.open(code, pass);
  Object.assign(Net, { mode: 'guest', room, code, pass, nick: cleanNick(nick), want: -1, hostP: null, hostSeen: false, queue: [], lastQueued: 0, lastPlayed: 0, answeredN: 0 });
  rememberRoom({ code, nick: Net.nick, pass });
  guestPush();
  room.onPeers(guestOnPeers);
  setTimeout(() => { if (Net.mode === 'guest' && !Net.hostSeen && typeof lobbyError === 'function') lobbyError(`部屋 ${code} が見つかりません。部屋番号と合言葉を確かめてね。`); }, 9000);
}
function guestOnPeers(ch) {
  if (Net.mode !== 'guest') return;
  Net.present = new Set(ch.peers.map(p => p.presence && p.presence.cid).filter(Boolean));
  const host = ch.peers.find(p => !(p.isMe && p.sameTab) && p.presence && p.presence.v === NET_V && p.presence.role === 'host' && p.presence.code === Net.code);
  if (!host) {
    if (Net.hostSeen && !Net.hostGoneTimer) Net.hostGoneTimer = setTimeout(() => { if (typeof hostGone === 'function') hostGone(); }, 8000);
    return;
  }
  clearTimeout(Net.hostGoneTimer); Net.hostGoneTimer = null;
  Net.hostSeen = true;
  if (host.presence === Net.hostP) { if (typeof renderLobby === 'function') renderLobby(); return; }
  Net.hostP = host.presence;
  guestHandleHost(host.presence);
}
function parseSeats(arr) {
  return [0, 1, 2, 3].map(i => {
    const s = Array.isArray(arr) ? arr[i] : 0;
    return Array.isArray(s) && typeof s[0] === 'string' ? { cid: s[0].slice(0, 24), nick: cleanNick(s[1]) } : null;
  });
}
function guestHandleHost(hp) {
  Net.seats = parseSeats(hp.seats);
  Net.mySeat = Net.seats.findIndex(s => s && s.cid === Net.cid);
  Net.years = isInt(hp.yr, 1, 10) ? hp.yr : 3;
  Net.speed = hp.sp === 'fast' ? 'fast' : 'normal';
  if (!hp.go) {
    if (Net.want === -1 && Net.mySeat === -1 && !Net.autoSat) {
      const free = Net.seats.findIndex(s => !s);
      if (free >= 0) { Net.autoSat = true; Net.want = free; guestPush(); }
    }
    if (typeof renderLobby === 'function') renderLobby();
    return;
  }
  if (!Net.started) {
    const g = decodeState(hp.st, Net.seats);
    if (!g) return;
    Net.started = true;
    G = g;
    Net.lastQueued = Net.lastPlayed = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
    Net.latest = hp;
    enterOnlineGame();
    guestPump();
    return;
  }
  let added = false;
  for (const ev of Array.isArray(hp.ev) ? hp.ev : []) {
    if (ev && typeof ev === 'object' && isInt(ev.n, 1, 1e9) && EV_TYPES.has(ev.t) && ev.n > Net.lastQueued) { Net.queue.push(ev); Net.lastQueued = ev.n; added = true; }
  }
  const sn = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
  if (sn > Net.lastQueued) Net.lastQueued = sn;   // 取りこぼしたイベントは状態の同期で補う
  Net.latest = hp;
  if (added && Net.skip) Net.skip();   // ホストが先に進んだら表示中のメッセージを閉じる
  guestPump();
}

async function guestPump() {
  if (Net.playing) return;
  Net.playing = true;
  try {
    for (;;) {
      while (Net.queue.length) {
        const ev = Net.queue.shift();
        try { await playEv(ev, Net.queue.length > 3); } catch (e) { console.error(e); }
        Net.lastPlayed = ev.n;
      }
      if (Net.lastPlayed < Net.lastQueued) Net.lastPlayed = Net.lastQueued;
      applyLatest();
      if (!Net.queue.length) break;
    }
  } finally { Net.playing = false; }
}
function applyLatest() {
  const hp = Net.latest;
  if (!hp || !hp.st) return;
  const sn = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
  if (sn > Net.lastPlayed) return;
  const g = decodeState(hp.st, Net.seats);
  if (g) { G = g; refresh(); }
  if (G && G.over) { if (!Net.finalShown) { Net.finalShown = true; showFinal(); } return; }
  guestPrompt(hp.pr);
}
function guestAnswer(pr, data) {
  if (Net.activePrompt !== pr) return;
  Net.answeredN = pr.n; Net.activePrompt = null;
  guestPush({ ans: { n: pr.n, ...data } });
}

/* 信州 道の駅すごろく — 立体の車とボンビーぐま
   three.js で車4台とクマを3Dで組み立て、いろいろな向きから描いた画像を用意する。
   地図の上ではその画像を進む向きに合わせて切りかえて走らせる（毎フレーム3D描画しないので軽い）。
   three.js が読めないときは、これまでの丸い顔のコマのまま遊べる。 */

const THREE_SRC = ['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js'];
const THREE_SRI = 'sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu';
const CAR_DIRS = 16;     // 車の向きの数
const CAR_PX = 176;      // 車を描く画像の大きさ（ピクセル）
const BEAR_PX = 220;     // クマの画像の大きさ
const BEAR_FRAMES = 12;  // クマのアニメーションのコマ数
const Sprites = { ready: false, cars: [], carAnchor: [0.5, 0.7], bear: [], bearFrame: 0 };

async function loadThree() {
  if (window.THREE) return;
  for (const src of THREE_SRC) { try { await loadScript(src, THREE_SRI); if (window.THREE) return; } catch (e) { /* 次を試す */ } }
  throw new Error('three-load');
}

// 3Dの準備。終わったら onReady を呼ぶ（失敗しても例外は出さない）
async function initSprites(onReady) {
  try {
    await loadThree();
    await new Promise(r => setTimeout(r, 30));
    buildSprites();
    Sprites.ready = true;
    setInterval(() => { Sprites.bearFrame = (Sprites.bearFrame + 1) % BEAR_FRAMES; tickBears(); }, 90);
    onReady && onReady();
  } catch (e) { console.warn('3D表示なしで続けます', e); }
}

/* ---------- 部品づくりの道具 ---------- */
function makeKit(T) {
  const mat = {
    rubber: new T.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.85 }),
    hub: new T.MeshStandardMaterial({ color: 0xdfe3ea, roughness: 0.35, metalness: 0.35 }),
    glass: new T.MeshStandardMaterial({ color: 0x25385a, roughness: 0.12, metalness: 0.3 }),
    dark: new T.MeshStandardMaterial({ color: 0x3b414c, roughness: 0.6 }),
    light: new T.MeshStandardMaterial({ color: 0xfffbe6, emissive: 0xfff2b0, emissiveIntensity: 0.7, roughness: 0.3 }),
    tail: new T.MeshStandardMaterial({ color: 0xe0262c, emissive: 0x7a0b0e, emissiveIntensity: 0.6, roughness: 0.35 }),
    chrome: new T.MeshStandardMaterial({ color: 0xc9ced6, roughness: 0.25, metalness: 0.5 }),
  };
  const paint = hex => new T.MeshStandardMaterial({ color: hex, roughness: 0.32, metalness: 0.12 });
  const plain = (hex, rough = 0.7) => new T.MeshStandardMaterial({ color: hex, roughness: rough });
  const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
  // 横から見た形（x=前後, y=高さ）を z 方向（車幅）に押し出す
  const extrude = (draw, width, material, bevel = 0.08) => {
    const shape = new T.Shape(); draw(shape);
    const depth = Math.max(0.01, width - bevel * 2);
    const geo = new T.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 12 });
    geo.translate(0, 0, -depth / 2);
    return shadowed(new T.Mesh(geo, material));
  };
  const poly = pts => s => { pts.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y))); s.closePath(); };
  const box = (w, h, d, material, x, y, z) => { const m = shadowed(new T.Mesh(new T.BoxGeometry(w, h, d), material)); m.position.set(x, y, z); return m; };
  const ball = (r, material, x, y, z, sx = 1, sy = 1, sz = 1) => { const m = shadowed(new T.Mesh(new T.SphereGeometry(r, 24, 16), material)); m.position.set(x, y, z); m.scale.set(sx, sy, sz); return m; };
  const wheels = (g, xs, zHalf, r, w = 0.3) => {
    const tire = new T.CylinderGeometry(r, r, w, 28), hub = new T.CylinderGeometry(r * 0.52, r * 0.52, w + 0.03, 18);
    for (const x of xs) for (const z of [-zHalf, zHalf]) {
      const t = shadowed(new T.Mesh(tire, mat.rubber)); t.rotation.x = Math.PI / 2; t.position.set(x, r, z); g.add(t);
      const h = new T.Mesh(hub, mat.hub); h.rotation.x = Math.PI / 2; h.position.set(x, r, z); g.add(h);
    }
  };
  const lamps = (g, front, rear, y, zHalf, round = false) => {
    for (const z of [-zHalf, zHalf]) {
      g.add(round ? ball(0.13, mat.light, front, y, z, 0.6, 1, 1) : box(0.06, 0.15, 0.34, mat.light, front, y, z));
      g.add(box(0.06, 0.18, 0.24, mat.tail, rear, y + 0.08, z));
    }
  };
  const bumpers = (g, front, rear, y, w) => { g.add(box(0.14, 0.22, w, mat.dark, front, y, 0)); g.add(box(0.14, 0.22, w, mat.dark, rear, y, 0)); };
  return { mat, paint, plain, extrude, poly, box, ball, wheels, lamps, bumpers };
}

/* ---------- 4台の車（前は +x 方向） ---------- */
function buildMinivan(T, K, color) {   // ながの社長：青いワゴン
  const g = new T.Group(), body = K.paint(color), W = 1.8;
  g.add(K.extrude(K.poly([[-1.92, 0.32], [-1.92, 1.04], [1.5, 1.04], [1.92, 0.88], [1.92, 0.32]]), W, body, 0.1));
  g.add(K.extrude(K.poly([[-1.86, 1.0], [-1.86, 1.56], [0.62, 1.56], [1.48, 1.0]]), W - 0.14, K.mat.glass, 0.04));
  g.add(K.extrude(K.poly([[-1.92, 1.54], [-1.92, 1.66], [0.66, 1.66], [0.74, 1.54]]), W - 0.04, body, 0.05));
  for (const x of [-1.84, -0.7, 0.2]) g.add(K.box(0.14, 0.56, W - 0.08, body, x, 1.28, 0));
  g.add(K.box(2.2, 0.05, 0.06, K.mat.chrome, -0.6, 1.74, 0.62)); g.add(K.box(2.2, 0.05, 0.06, K.mat.chrome, -0.6, 1.74, -0.62));
  K.bumpers(g, 1.97, -1.97, 0.42, W - 0.1); K.lamps(g, 1.97, -1.97, 0.78, 0.6); K.wheels(g, [1.22, -1.22], 0.83, 0.38);
  return g;
}
function buildApple(T, K, color) {     // りんご社長：赤い丸っこい車
  const g = new T.Group(), body = K.paint(color), W = 1.72;
  g.add(K.extrude(s => { s.moveTo(-1.72, 0.3); s.lineTo(-1.8, 0.72); s.quadraticCurveTo(-1.78, 1.0, -1.45, 1.0); s.lineTo(1.2, 1.0); s.quadraticCurveTo(1.8, 0.94, 1.8, 0.55); s.lineTo(1.76, 0.3); s.closePath(); }, W, body, 0.12));

/* ---------- 画像を描く ---------- */
function buildSprites() {
  const T = THREE, K = makeKit(T);
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  scene.add(new T.HemisphereLight(0xffffff, 0x6f7f99, 0.9));
  const sun = new T.DirectionalLight(0xffffff, 0.85);
  sun.position.set(-4, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(sun);
  const ground = new T.Mesh(new T.PlaneGeometry(16, 16), new T.ShadowMaterial({ opacity: 0.3 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // 車：斜め上から見下ろすカメラで、16方向ぶん描く
  renderer.setSize(CAR_PX, CAR_PX);
  const cam = new T.PerspectiveCamera(22, 1, 0.1, 100);
  cam.position.set(0, 9.7, 8.7); cam.lookAt(0, 0.75, 0); cam.updateMatrixWorld();
  const o = new T.Vector3(0, 0, 0).project(cam);
  Sprites.carAnchor = [(o.x + 1) / 2, (1 - o.y) / 2];
  const builders = [buildMinivan, buildApple, buildKeiTruck, buildSuv];
  const paints = [0x1f63d6, 0xe0302f, 0x22a04a, 0xec7a12];   // 光が当たっても社長の色に見えるよう少し濃いめ
  PLAYER_DEFS.forEach((d, i) => {
    const car = builders[i](T, K, paints[i]);
    scene.add(car);
    const frames = [];
    for (let k = 0; k < CAR_DIRS; k++) {
      car.rotation.y = -k * (2 * Math.PI / CAR_DIRS);
      renderer.render(scene, cam);
      frames.push(renderer.domElement.toDataURL('image/png'));
    }
    scene.remove(car);
    Sprites.cars.push(frames);
  });

  // クマ：正面から、体をゆらして手をふるアニメーション
  renderer.setSize(BEAR_PX, BEAR_PX);
  const bcam = new T.PerspectiveCamera(30, 1, 0.1, 100);
  bcam.position.set(0, 3.3, 8.6); bcam.lookAt(0, 1.75, 0);
  const bear = buildBear(T, K);
  scene.add(bear.g);
  for (let f = 0; f < BEAR_FRAMES; f++) {
    const t = f / BEAR_FRAMES * Math.PI * 2;
    bear.g.rotation.y = 0.28 * Math.sin(t);
    bear.body.position.y = 0.06 * Math.abs(Math.sin(t));
    bear.body.rotation.z = 0.06 * Math.sin(t);
    bear.head.rotation.z = 0.14 * Math.sin(t + 0.6);
    bear.armR.rotation.z = -0.5 + 0.45 * Math.sin(t * 2);
    renderer.render(scene, bcam);
    Sprites.bear.push(renderer.domElement.toDataURL('image/png'));
  }
  scene.remove(bear.g);
  renderer.dispose();
  renderer.forceContextLoss && renderer.forceContextLoss();
}

function carDirIndex(dx, dy) {

}
